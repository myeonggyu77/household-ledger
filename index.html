<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>

<!-- PWA: 홈 화면에 설치해서 앱처럼 쓸 수 있게 해주는 설정이에요 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f6e56">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1a2420;
    --ink-soft: #56635c;
    --ink-faint: #8a958f;
    --paper: #fbfaf7;
    --paper-raised: #ffffff;
    --line: #dcdcd2;
    --line-soft: #ececE4;
    --accent: #0f6e56;
    --accent-soft: #e1f0ea;
    --accent-tint: #f2f8f5;
    --accent-line: #9dc9bb;
    --down: #a32d2d;
    --down-soft: #fcebeb;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --cat-0: #2a78d6; --cat-1: #eb6834; --cat-2: #1baf7a; --cat-3: #c98500;
    --cat-4: #d5588a; --cat-5: #008300; --cat-6: #4a3aa7; --cat-7: #e34948;
    --status-good: #0ca30c; --status-warn: #d98300; --status-crit: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .app { max-width: none; margin: 0; display: flex; align-items: flex-start; }
  .main-content { flex: 1; min-width: 0; padding: 28px 24px 60px; }
  @media (min-width: 860px) {
    html, body { overflow: hidden; }
    .app { height: 100vh; }
    .main-content { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .main-content > .kpi-row { flex-shrink: 0; }
    .main-content > .panel.active { flex: 1; min-height: 0; overflow-y: auto; }
  }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
  .kpi { background: var(--paper-raised); padding: 10px 12px; }
  .kpi .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; white-space: nowrap; }
  .kpi .val { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .kpi .val.income { color: var(--accent); }
  .kpi .val.expense { color: var(--down); }

  .sidebar { width: 76px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; padding: 20px 6px; border-right: 1px solid var(--line); position: sticky; top: 0; align-self: flex-start; max-height: 100vh; overflow-y: auto; }
  .tab { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-faint); background: none; border: none; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; text-align: center; line-height: 1.2; }
  .tab i { font-size: 19px; }
  .tab.active { color: var(--ink); background: var(--accent-tint); font-weight: 600; }
  .tab:hover:not(.active) { color: var(--ink-soft); background: var(--line-soft); }

  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .toolbar .hint { font-size: 12px; color: var(--ink-faint); }
  .toolbar .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-wrap { flex: 1; max-width: 240px; position: relative; }
  input.search-input { width: 100%; height: 34px; padding: 0 12px 0 30px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238a958f" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 8px center; background-size: 14px; }
  input.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.primary-btn { font-family: var(--sans); font-size: 13px; font-weight: 500; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.primary-btn:hover { background: #000; }
  button.ghost-btn { font-family: var(--sans); font-size: 13px; background: none; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.ghost-btn:hover { background: var(--line-soft); }
  button.icon-btn { font-family: var(--sans); font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; padding: 4px 9px; color: var(--ink-soft); margin-left: 4px; }
  button.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  button.icon-btn.danger { color: var(--down); border-color: var(--down-soft); }
  button.icon-btn.danger:hover { background: var(--down-soft); }
  button.icon-btn:disabled { opacity: 0.35; cursor: default; }
  button.icon-btn:disabled:hover { background: none; color: var(--ink-soft); }
  .cat-drag-handle { cursor: grab; touch-action: none; }
  .cat-parent-group.cat-dragging, .cat-chip.cat-dragging { z-index: 9999; box-shadow: 0 6px 18px rgba(0,0,0,0.28); opacity: 0.96; pointer-events: none; }
  .cat-drag-placeholder { border: 2px dashed var(--line); background: var(--line-soft); border-radius: 10px; }
  .cat-child-list .cat-drag-placeholder { margin-bottom: 6px; }
  button.ghost-btn.danger-btn { color: var(--down); border-color: #f0c7c7; }
  button.ghost-btn.danger-btn:hover { background: var(--down-soft); }

  .form-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .form-card h3 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  .section-heading { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .rec-group-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 9px 12px; margin-top: 20px; border-radius: 10px 10px 0 0; }
  .rec-group-head:first-of-type { margin-top: 0; }
  .rec-group-head .count { font-weight: 400; color: inherit; opacity: .7; font-size: 11px; }
  .rec-group-head.income { background: var(--accent-soft); color: var(--accent); }
  .rec-group-head.expense { background: var(--down-soft); color: var(--down); }
  .rec-group-head.transfer { background: var(--line-soft); color: var(--ink-soft); }
  .rec-group-head + .overflow-x table { border-top: none; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
  input, select, textarea { font-family: var(--sans); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 0 9px; background: var(--paper); color: var(--ink); width: 100%; }
  input, select { height: 34px; }
  textarea { padding: 9px; min-height: 70px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .form-note { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .usage-link { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .usage-link:hover { color: var(--accent); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .field-lbl { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
  .field { margin-bottom: 12px; }
  .receipt-thumb-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .receipt-thumb-wrap { position: relative; width: 82px; height: 82px; flex-shrink: 0; }
  .receipt-thumb { width: 82px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .receipt-thumb-loading { width: 82px; height: 82px; border-radius: 8px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink-faint); background: var(--paper-raised); }
  .receipt-remove-btn { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overflow-x table { table-layout: auto; min-width: 480px; }
  tbody td { white-space: nowrap; padding: 10px 8px; border-bottom: 1px solid var(--line-soft); }
  tbody tr.day-boundary td { border-bottom: 2px solid var(--accent-line); }
  .name-cell { line-height: 1.35; white-space: normal; overflow: visible; text-overflow: clip; word-break: keep-all; overflow-wrap: break-word; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 4; box-shadow: 0 1px 0 var(--ink); white-space: nowrap; }
  thead th.sortable-th { cursor: pointer; user-select: none; }
  thead th.sortable-th:hover { color: var(--ink); }
  thead th.sortable-th .sort-arrow { display: inline-block; margin-left: 2px; color: var(--accent); }
  th.num, td.num { text-align: right; font-family: var(--mono); min-width: 128px; }
  tbody tr:hover { background: var(--accent-tint); }
  .actions-cell { text-align: right; white-space: normal; overflow: visible; width: 86px; }
  .actions-cell button { padding: 3px 5px !important; margin-left: 2px; font-size: 11px !important; }
  .dcol { display: none; }
  .dcol-balance { display: none; }
  td.memo-col { white-space: normal; max-width: 200px; }
  .memo-inner { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
  .overflow-x { overflow-x: auto; overflow-y: auto; max-height: 66vh; border-radius: 8px; }
  .empty { text-align: center; padding: 40px 0; color: var(--ink-faint); font-size: 13px; }
  .empty .big { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; }

  .amt.income { color: var(--accent); font-weight: 600; }
  .amt.expense { color: var(--down); font-weight: 600; }
  .amt.transfer { color: var(--ink-soft); font-weight: 600; }
  .type-tag { font-size: 11px; font-family: var(--mono); font-weight: 600; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .type-tag.income { background: var(--accent-soft); color: var(--accent); }
  .type-tag.expense { background: var(--down-soft); color: var(--down); }
  .type-tag.transfer { background: var(--line-soft); color: var(--ink-soft); }
  .ccy-badge { font-size: 10px; font-family: var(--mono); font-weight: 600; padding: 1px 5px; border-radius: 6px; vertical-align: 1px; }
  .ccy-badge.usd { background: var(--accent-soft); color: var(--accent); }

  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { font-family: var(--sans); font-size: 13px; padding: 10px 16px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 90vw; text-align: center; animation: toast-in 0.2s ease-out; }
  .toast.error { background: #fcebeb; color: #a32d2d; border: 1px solid #f0c7c7; }
  .toast.success { background: var(--accent-soft); color: var(--accent); border: 1px solid #b9dfd0; }
  .toast.info { background: var(--paper-raised); color: var(--ink-soft); border: 1px solid var(--line); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(26,36,32,0.45); z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; margin: auto; }
  .modal-card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .panel-footer-actions { display: none; }
  @media (min-width: 860px) {
    .modal-overlay.side-panel { background: rgba(26,36,32,0.06); justify-content: flex-end; align-items: stretch; padding: 0; }
    .modal-overlay.side-panel .modal-card { margin: 0; width: 400px; max-width: 92vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: -8px 0 24px rgba(0,0,0,.14); animation: side-panel-in .16s ease-out; }
    .panel-footer-actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  }
  @keyframes side-panel-in { from { transform: translateX(28px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
  .tx-row-clickable { cursor: default; }
  @media (min-width: 860px) {
    .tx-actions-cell { display: none; }
    .tx-row-clickable { cursor: pointer; }
    .tx-row-clickable.row-editing { background: var(--accent-tint); }
  }
  .tx-split { display: flex; align-items: flex-start; width: 100%; }
  .tx-split-main { flex: 3 1 420px; min-width: 0; }
  .tx-inline-panel { width: 0; flex: 0 0 0; min-width: 0; overflow: hidden; }
  .tx-inline-panel .tx-inline-card { max-width: none; max-height: none; height: auto; width: 100%; border: none; box-shadow: none; padding: 0; margin: 0; background: transparent; overflow: visible; }
  @media (min-width: 860px) {
    .tx-inline-panel.active { flex: 2 1 360px; min-width: 300px; max-width: 480px; max-height: 100%; overflow-y: auto; margin-left: 16px; padding-left: 16px; border-left: 1px solid var(--line); }
  }
  .rec-list { min-width: 0; }
  .rec-list .overflow-x { border: 1px solid var(--line); border-radius: 12px; }
  #panel-recurring tbody td { padding: 7px 8px; }
  #panel-recurring thead th { padding: 6px 8px; }
  #panel-insurance thead th { padding: 6px 8px; white-space: normal; text-align: center; font-family: var(--sans); background: #E9967A; }
  #panel-insurance thead tr:last-child th { top: 28px; z-index: 3; }
  #panel-insurance td.name-cell { white-space: pre-line; }
  #panel-insurance table { border-left: 1px solid #9a9a93; border-top: 1px solid #9a9a93; }
  #panel-insurance th, #panel-insurance td { border-right: 1px solid #a5a5a0; }
  #panel-insurance tbody td { border-bottom: 2px solid #a5a5a0; }
  #panel-insurance th.num, #panel-insurance td.num { min-width: 0; }
  #panel-insurance .overflow-x table { table-layout: fixed; width: 100%; min-width: 0; }
  #panel-insurance td, #panel-insurance th { overflow: hidden; text-overflow: ellipsis; }
  .dp-pop { position: fixed; z-index: 10000; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 10px; width: 250px; }
  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dp-head .dp-label { font-family: var(--mono); font-size: 13px; font-weight: 600; cursor: pointer; }
  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-dow { text-align: center; font-size: 10px; color: var(--ink-faint); padding: 2px 0; }
  .dp-cell { text-align: center; font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .dp-cell:hover { background: var(--line-soft); }
  .dp-cell.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .dp-cell.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .dp-cell.adjacent { color: var(--ink-faint); opacity: .55; }
  .dp-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .date-field[readonly] { cursor: pointer; }
  .cp-pop { position: fixed; z-index: 10000; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 8px; width: 280px; max-height: 320px; display: flex; flex-direction: column; }
  .cp-search { flex: none; margin-bottom: 6px; }
  .cp-list { overflow-y: auto; flex: 1; min-height: 0; }
  .cp-group-label { font-size: 11px; font-weight: 600; color: var(--ink-faint); padding: 6px 8px 2px; }
  .cp-item { padding: 7px 8px; font-size: 13px; border-radius: 8px; cursor: pointer; }
  .cp-item:hover { background: var(--line-soft); }
  .cp-item.sel { background: var(--accent-tint); font-weight: 600; }
  .cp-item.active { box-shadow: inset 0 0 0 1px var(--accent); }
  .mp-pop { position: fixed; z-index: 10000; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 10px; width: 216px; }
  .mp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mp-head .mp-year { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .mp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .mp-cell { text-align: center; font-size: 12px; padding: 9px 0; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .mp-cell:hover { background: var(--line-soft); }
  .mp-cell.sel { background: var(--accent); color: #fff; font-weight: 600; }

  #auth-gate { position: fixed; inset: 0; background: var(--paper); z-index: 9500; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .auth-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 360px; margin: auto; }
  .auth-card h1 { margin: 0 0 4px; font-size: 20px; }
  .auth-card .sub { color: var(--ink-faint); font-size: 13px; margin-bottom: 18px; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 8px; background: var(--paper-raised); border: none; border-right: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink-soft); font-family: var(--sans); }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ink); color: var(--paper); }
  .seg button.active.expense-active { background: var(--down); }
  .seg button.active.income-active { background: var(--accent); }

  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .ghost-btn.acct-seg-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .month-nav .m-label { font-family: var(--mono); font-size: 14px; font-weight: 600; min-width: 96px; text-align: center; position: relative; cursor: pointer; }
  .month-nav .m-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; padding: 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
  .cal-dow { background: var(--paper); text-align: center; font-size: 11px; color: var(--ink-faint); padding: 6px 0; text-transform: uppercase; }
  .cal-cell { background: var(--paper-raised); min-height: 74px; padding: 6px; cursor: pointer; }
  .cal-cell.adjacent { background: var(--paper); }
  .cal-cell.adjacent .date-num { color: var(--ink-faint); }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell.selected { background: var(--accent-tint); }
  .cal-cell:hover { background: var(--line-soft); }
  .cal-cell .date-num { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .cal-cell .cal-amt { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; }
  .cal-amt.inc { color: var(--accent); }
  .cal-amt.exp { color: var(--down); }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .bar-row .bar-lbl { width: 130px; font-size: 12.5px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-track { flex: 1; height: 8px; background: var(--line-soft); border-radius: 8px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 8px; }
  .bar-row .bar-val { width: 130px; text-align: right; font-family: var(--mono); font-size: 12px; flex-shrink: 0; }
  .bar-row .bar-pct { width: 44px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }

/* ---------------- cloud login (Supabase) ---------------- */
const SUPABASE_URL = 'https://kcmqzinekvikpmlxkdxf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_rZ6bmiQGScI6YewuRg_5aw_PijLpbkl';
let sb = null;
try {

  if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
} catch (e) { console.error('Supabase init failed', e); }

let authMode = 'login';
let currentUserId = null;
let currentUserEmail = null;
let cloudSaveTimer = null;

function setAuthMode(m) {
  authMode = m;
  document.querySelectorAll('#auth-mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.v === m));
  document.getElementById('auth-submit-btn').textContent = m === 'login' ? '로그인' : '회원가입';
  document.getElementById('auth-hint').textContent = m === 'signup' ? '가입 후 이메일 인증이 필요할 수 있어요.' : '';
  document.getElementById('auth-error').style.display = 'none';
}
function authErrorMessage(msg) {
  if (/Invalid login credentials/i.test(msg)) return '이메일 또는 비밀번호가 올바르지 않아요.';
  if (/already registered|already exists/i.test(msg)) return '이미 가입된 이메일이에요. 로그인해주세요.';
  if (/Password should be|password.*least/i.test(msg)) return '비밀번호는 6자 이상이어야 해요.';
  if (/Email not confirmed/i.test(msg)) return '이메일 인증이 필요해요. 받은 메일함을 확인해주세요.';
  if (/rate limit/i.test(msg)) return '요청이 너무 많아요. 잠시 후 다시 시도해주세요.';
  return msg || '알 수 없는 오류가 발생했어요.';
}
async function submitAuth() {
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!sb) { errEl.textContent = '로그인 서비스에 연결할 수 없어요. 네트워크를 확인해주세요.'; errEl.style.display = 'block'; return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true;
  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await onAuthed(data.user.id);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) {
        await onAuthed(data.user.id);
      } else {
        errEl.style.color = 'var(--accent)';
        errEl.textContent = '가입 확인 이메일을 보냈어요. 메일함에서 인증 후 로그인해주세요.';
        errEl.style.display = 'block';
        setAuthMode('login');
      }
    }
  } catch (e) {
    errEl.style.color = 'var(--down)';
    errEl.textContent = authErrorMessage(e.message);
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

  const { data, error } = await sb.from('user_data').select('data').eq('user_id', userId).maybeSingle();
  if (error) { console.error('cloud load failed', error); return { ok: false }; }
  return { ok: true, data: data ? data.data : undefined };
}
async function buildCloudPayload() {
  return DATA;
}

  if (!sb || !currentUserId) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    const payload = await buildCloudPayload();
    sb.from('user_data').upsert({ user_id: currentUserId, data: payload, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) console.error('cloud save failed', error); });
  }, 800);
}
async function onAuthed(userId) {
  currentUserId = userId;
  const { data: { user } } = await sb.auth.getUser();
  try {
    const result = await loadCloudData(userId);

      await sb.from('user_data').upsert({ user_id: userId, data: payload, updated_at: new Date().toISOString() });
    } else if (result.ok && result.data && Array.isArray(result.data.categories) && result.data.categories.length) {
      let cloudData = result.data;

      cloudData.insApplyTypes = Array.isArray(cloudData.insApplyTypes) ? cloudData.insApplyTypes : [];

      cloudData = migrateCategoriesToHierarchy(cloudData);

      const payeeVendorRegistrySeededBefore = !!(cloudData.settings && cloudData.settings.payeeVendorRegistrySeeded);
      cloudData = migratePayeeVendorRegistry(cloudData);
      cloudData = migrateSeedInsuranceTagLists(cloudData);
      cloudData = migrateSeedInsuranceExtraTagLists(cloudData);
      const categoriesChanged = cloudData.categories.length !== catCountBefore || (!stockMigratedBefore && cloudData.settings.stockTransferCategoryMigrated);
      delete cloudData.receiptsById;

/* ---------------- 한국 공휴일(음력 포함) 자동 계산 ----------------
   브라우저의 Intl 음력(chinese) 캘린더로 설날/추석/부처님오신날의 양력 날짜를 매년 계산하고,
   대체공휴일 규정(신정·현충일 제외, 주말과 겹치면 다음 평일에 하루를 더 지정)을 적용해요.
   회사 임시 휴무일처럼 이 계산에 없는 날짜는 설정 > 공휴일 관리에서 직접 추가할 수 있어요. */
function _addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function _isWeekendDate(d) { const w = d.getDay(); return w === 0 || w === 6; }
function _lunarMonthDay(date) {
  try {
    const parts = new Intl.DateTimeFormat('en-u-ca-chinese', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(date);
    return { month: Number(parts.find(p => p.type === 'month').value), day: Number(parts.find(p => p.type === 'day').value) };
  } catch (e) { return null; }
}
function _findLunarDate(gYear, lunarMonth, lunarDay, searchStartMonth, searchStartDay, rangeDays) {
  const start = new Date(gYear, searchStartMonth - 1, searchStartDay);
  for (let i = 0; i < rangeDays; i++) {
    const d = _addDays(start, i);
    const lm = _lunarMonthDay(d);
    if (lm && lm.month === lunarMonth && lm.day === lunarDay) return d;
  }
  return null;
}
function krHolidaysForYear(y) {
  const singles = [
    { date: new Date(y, 0, 1), subEligible: false },  // 신정
    { date: new Date(y, 2, 1), subEligible: true },   // 삼일절
    { date: new Date(y, 4, 5), subEligible: true },   // 어린이날
    { date: new Date(y, 5, 6), subEligible: false },  // 현충일
    { date: new Date(y, 7, 15), subEligible: true },  // 광복절
    { date: new Date(y, 9, 3), subEligible: true },   // 개천절
    { date: new Date(y, 9, 9), subEligible: true },   // 한글날
    { date: new Date(y, 11, 25), subEligible: true }, // 성탄절(크리스마스)
  ];
  const seol = _findLunarDate(y, 1, 1, 1, 10, 55);     // 설날 (음력 1/1)
  const buddha = _findLunarDate(y, 4, 8, 4, 5, 60);    // 부처님오신날 (음력 4/8)
  const chu = _findLunarDate(y, 8, 15, 8, 25, 50);     // 추석 (음력 8/15)
  if (buddha) singles.push({ date: buddha, subEligible: true });
  const seollalGroup = seol ? [-1, 0, 1].map(o => _addDays(seol, o)) : [];
  const chuseokGroup = chu ? [-1, 0, 1].map(o => _addDays(chu, o)) : [];

  const allDates = singles.map(s => s.date).concat(seollalGroup, chuseokGroup);
  const baseSet = new Set(allDates.map(ymd));
  const subs = [];
  const addSub = (afterDate) => {
    let d = _addDays(afterDate, 1);
    while (_isWeekendDate(d) || baseSet.has(ymd(d)) || subs.some(s => ymd(s) === ymd(d))) d = _addDays(d, 1);
    subs.push(d);
  };
  singles.forEach(({ date, subEligible }) => { if (subEligible && _isWeekendDate(date)) addSub(date); });
  if (seollalGroup.length && seollalGroup.some(_isWeekendDate)) addSub(seollalGroup[2]);
  if (chuseokGroup.length && chuseokGroup.some(_isWeekendDate)) addSub(chuseokGroup[2]);

  return allDates.concat(subs);
}
const _krHolidayCache = {};
function krHolidaySetForYear(y) {
  if (!_krHolidayCache[y]) _krHolidayCache[y] = new Set(krHolidaysForYear(y).map(ymd));
  return _krHolidayCache[y];
}

/* 구버전(대/소분류 구분 없는 평평한 카테고리) 데이터를 대분류 트리 밑으로 옮겨요.
   이름이 기본 카테고리와 일치하면 해당 대분류로, 아니면(사용자가 직접 추가한 카테고리) '기타'로 보내요. */
function migrateCategoriesToHierarchy(d) {
  if (d.categorySchema === 2) return d;
  const leafToGroup = {};
  ['expense', 'income'].forEach((type) => {
    CATEGORY_TREE[type].forEach((group) => {
      group.children.forEach(([name]) => { leafToGroup[type + ':' + name] = group; });
    });
  });
  const fallback = {
    expense: CATEGORY_TREE.expense.find((g) => g.name === '기타'),
    income: CATEGORY_TREE.income.find((g) => g.name === '용돈/기타수입'),
  };
  const parentIdByKey = {};
  const migrated = [];
  (d.categories || []).forEach((cat) => {
    if (cat.parentId) { migrated.push(cat); return; }
    const group = leafToGroup[cat.type + ':' + cat.name] || fallback[cat.type] || fallback.expense;
    const key = cat.type + ':' + group.name;
    if (!parentIdByKey[key]) {
      const pid = uid();
      parentIdByKey[key] = pid;
      migrated.push({ id: pid, type: cat.type, name: group.name, icon: group.icon, parentId: null });
    }
    migrated.push({ ...cat, parentId: parentIdByKey[key] });
  });
  d.categories = migrated;
  d.categorySchema = 2;
  return d;
}

function migrateAccountTypes(d) {
  (d.accounts || []).forEach((a) => {
    if (!ACC_TYPES.includes(a.type)) { a.type = a.type === 'card' ? 'installment' : 'other'; a.icon = ACC_TYPE_ICON[a.type]; }
    if (a.currency !== 'USD') a.currency = 'KRW';
  });
  return d;
}

/* 카테고리 대분류/소분류 목록을 CATEGORY_TREE의 최신 구성으로 통째로 교체해요(한 번만 실행).
   기존에 쓰던 카테고리는 이 최신 목록엔 없는 이름들이라 그대로 옮길 수 없어서,
   그 카테고리가 달려있던 거래/예산/정기거래는 전부 각 타입의 '기타' 카테고리로 옮겨요. */
const CATEGORY_TREE_VERSION = 1;
function migrateToUpdatedCategoryTree(d) {
  if (d.categoryTreeVersion === CATEGORY_TREE_VERSION) return d;
  const oldTypeById = {};
  (d.categories || []).forEach((c) => { oldTypeById[c.id] = c.type; });

  const categories = [];
  const colorCounter = { expense: 0, income: 0 };
  const fallbackLeafId = {};
  ['expense', 'income'].forEach((type) => {
    CATEGORY_TREE[type].forEach((group) => {
      const parentId = uid();
      categories.push({ id: parentId, type, name: group.name, icon: group.icon, parentId: null });
      group.children.forEach(([name, icon]) => {
        const leafId = uid();
        categories.push({ id: leafId, type, name, icon, parentId, colorIdx: colorCounter[type]++ % 8 });
        if (group.name === '기타' && name === '기타') fallbackLeafId[type] = leafId;
      });
    });
  });

  (d.transactions || []).forEach((t) => {
    const type = oldTypeById[t.categoryId] || t.type;
    if (fallbackLeafId[type]) t.categoryId = fallbackLeafId[type];
  });
  (d.recurring || []).forEach((r) => {
    if (r.categoryId == null) return;
    const type = oldTypeById[r.categoryId] || r.type;
    if (fallbackLeafId[type]) r.categoryId = fallbackLeafId[type];
  });
  const migratedBudgets = {};
  Object.entries(d.budgets || {}).forEach(([catId, amt]) => {
    const fallbackId = fallbackLeafId.expense;
    if (fallbackId) migratedBudgets[fallbackId] = (migratedBudgets[fallbackId] || 0) + amt;
  });

  d.categories = categories;
  d.budgets = migratedBudgets;
  d.categoryTreeVersion = CATEGORY_TREE_VERSION;
  return d;
}

/* 이체(transfer)에도 카테고리를 붙일 수 있도록, 이체용 카테고리가 아직 없는 기존 데이터에
   한 번만 추가해요. 기존 지출/수입 카테고리는 전혀 건드리지 않아요. */
function migrateAddTransferCategories(d) {
  if ((d.categories || []).some((c) => c.type === 'transfer')) return d;
  const colorCounter = { transfer: 0 };
  (CATEGORY_TREE.transfer || []).forEach((group) => {
    const parentId = uid();
    d.categories.push({ id: parentId, type: 'transfer', name: group.name, icon: group.icon, parentId: null });
    group.children.forEach(([name, icon]) => {
      d.categories.push({ id: uid(), type: 'transfer', name, icon, parentId, colorIdx: colorCounter.transfer++ % 8 });
    });
  });
  return d;
}

/* 일회성 데이터 보정: 메모가 "주식모으기 이체"인 이체 거래/정기거래의 카테고리를 "주식투자"로 맞춰요. */
function migrateStockTransferCategory(d) {
  d.settings = d.settings || {};
  if (d.settings.stockTransferCategoryMigrated) return d;
  const stockCat = (d.categories || []).find((c) => c.type === 'transfer' && c.name === '주식투자');
  if (stockCat) {
    (d.transactions || []).forEach((t) => { if (t.type === 'transfer' && t.memo === '주식모으기 이체') t.categoryId = stockCat.id; });
    (d.recurring || []).forEach((r) => { if (r.type === 'transfer' && r.name === '주식모으기 이체') r.categoryId = stockCat.id; });
  }
  d.settings.stockTransferCategoryMigrated = true;
  return d;
}

/* '생활비 이체' 이체 소분류가 없으면 기타 그룹 아래에 추가해요(additive, 한 번만). */
function migrateAddLifeTransferLeaf(d) {
  d.settings = d.settings || {};
  if (d.settings.lifeTransferLeafAdded) return d;
  if ((d.categories || []).some((c) => c.type === 'transfer' && c.name === '생활비 이체')) {
    d.settings.lifeTransferLeafAdded = true;
    return d;
  }
  let kitaParent = (d.categories || []).find((c) => c.type === 'transfer' && c.name === '기타' && !c.parentId);
  if (!kitaParent) {
    kitaParent = { id: uid(), type: 'transfer', name: '기타', icon: '📦', parentId: null };
    d.categories.push(kitaParent);
  }
  const leafCount = (d.categories || []).filter((c) => c.type === 'transfer' && c.parentId).length;
  d.categories.push({ id: uid(), type: 'transfer', name: '생활비 이체', icon: '🏠', parentId: kitaParent.id, colorIdx: leafCount % 8 });
  d.settings.lifeTransferLeafAdded = true;
  return d;
}

/* 일회성 데이터 보정: 메모가 "생활비 이체"인 이체 거래/정기거래의 카테고리를 "생활비 이체"로 맞춰요. */
function migrateLifeTransferCategory(d) {
  d.settings = d.settings || {};
  if (d.settings.lifeTransferCategoryMigrated) return d;
  const lifeCat = (d.categories || []).find((c) => c.type === 'transfer' && c.name === '생활비 이체');
  if (lifeCat) {

/* 일회성 데이터 보정: 메모에 사람 이름이 단어로 들어있으면 적용대상으로 옮기고 메모에서 그 단어를 지워요. */
const MEMO_PAYEE_EXTRACT_RULES = [
  { find: '아빠', payee: '아빠' },
  { find: '현승이', payee: '현승' },
  { find: '엄마', payee: '엄마' },
  { find: '현수', payee: '현수' },
  { find: '현정이', payee: '현정이' },

function extractPayeeFromMemoText(memo) {
  const tokens = memo.split(/\s+/).filter(Boolean);
  let payee = null;
  const kept = tokens.filter((tok) => {
    const rule = MEMO_PAYEE_EXTRACT_RULES.find((r) => r.find === tok);
    if (rule) { if (!payee) payee = rule.payee; return false; }
    return true;
  });
  return { memo: kept.join(' '), payee };
}
function migratePayeeFromMemo(d) {
  d.settings = d.settings || {};
  if (d.settings.payeeExtractedFromMemo) return d;
  (d.transactions || []).forEach((t) => {

    const { memo, payee } = extractPayeeFromMemoText(t.memo);
    if (payee) {

      if (!t.payee) t.payee = payee;
    }
  });

  return d;
}

/* 일회성 데이터 보정: 영수증 1장만 지원하던 시절의 hasReceipt 플래그를 배열(receiptIds)로 바꿔요.
   기존 사진은 거래 id를 키로 그대로 저장돼 있으므로 재업로드 없이 [t.id]로 이어받아요. */

/* ---------------- date helpers ---------------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function shiftMonth(mKey, delta) {
  const [y, m] = mKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function monthLabel(mKey) { const [y, m] = mKey.split('-').map(Number); return `${y}년 ${m}월`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function monthlyDayForMonth(r, y, m) { return r.day === 'last' ? daysInMonth(y, m) : Math.min(r.day || 1, daysInMonth(y, m)); }
function todayStr() { return ymd(new Date()); }
function isHolidayDate(d) {
  const wd = d.getDay();
  if (wd === 0 || wd === 6) return true;
  if (krHolidaySetForYear(d.getFullYear()).has(ymd(d))) return true;
  return (DATA.holidays || []).includes(ymd(d));
}
function nextBusinessDay(d) {
  const nd = new Date(d);
  while (isHolidayDate(nd)) nd.setDate(nd.getDate() + 1);
  return nd;
}
function prevBusinessDay(d) {
  const nd = new Date(d);
  while (isHolidayDate(nd)) nd.setDate(nd.getDate() - 1);
  return nd;
}
function isRecurringDueOn(r, d) {
  const freq = r.frequency || 'monthly';
  if (freq === 'daily') {
    return (r.dailyMode || 'weekdaysOnly') === 'everyday' || !isHolidayDate(d);
  }
  // Scan nearby calendar days for the un-shifted ("raw") occurrence and check whether its
  // holiday-shifted date lands on d — scanning (rather than reconstructing raw from d's own
  // week/month) keeps this correct even when a shift chain crosses a week/month boundary.
  const isRawDay = freq === 'weekly'
    ? (cand) => cand.getDay() === (r.weekday != null ? r.weekday : 1)
    : freq === 'yearly'
    ? (cand) => cand.getMonth() + 1 === (r.month || 1) && cand.getDate() === monthlyDayForMonth(r, cand.getFullYear(), r.month || 1)
    : (cand) => cand.getDate() === monthlyDayForMonth(r, cand.getFullYear(), cand.getMonth() + 1);
  for (let off = -8; off <= 8; off++) {
    const raw = _addDays(d, off);
    if (!isRawDay(raw)) continue;
    let eff = raw;
    if (r.type === 'expense' && !r.noHolidayShift) eff = nextBusinessDay(raw);
    else if (r.type === 'income' && r.payBeforeHoliday) eff = prevBusinessDay(raw);
    if (ymd(eff) === ymd(d)) return true;
  }
  return false;
}
function recurringAlreadyAppliedForPeriod(r, d) {
  const freq = r.frequency || 'monthly';
  if (freq === 'daily') {
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date === ymd(d));
  }
  if (freq === 'weekly') {
    const sun = ymd(_addDays(d, -d.getDay())), sat = ymd(_addDays(d, 6 - d.getDay()));
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date >= sun && t.date <= sat);
  }
  if (freq === 'yearly') {
    const y = String(d.getFullYear());
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date.slice(0, 4) === y);
  }
  const mKey = monthKey(d);
  return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date.slice(0, 7) === mKey);
}

/* ---------------- formatting ---------------- */
function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function wonSigned(n) { const sign = n < 0 ? '-' : ''; return sign + Math.round(Math.abs(n)).toLocaleString('ko-KR') + '원'; }
function usdFmt(n) { return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  const oldIndex = oldSiblings.findIndex(c => c.id === id);
  if (oldIndex === -1 || oldIndex === newIndex) return;
  DATA.categories.splice(DATA.categories.indexOf(cat), 1);
  const newSiblings = cat.parentId ? childCategories(cat.parentId) : topCategories(cat.type);
  const insertAt = newIndex >= newSiblings.length

/* ---------------- derived data ---------------- */
function accountBalance(acc, beforeDate) {

    if (t.type === 'income' && t.accountId === acc.id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) bal -= t.amount;
    else if (t.type === 'transfer') {

      if (t.toAccountId === acc.id) bal += t.amount;

  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay${sidePanel ? ' side-panel' : ''}" id="modal-overlay"><div class="modal-card">${innerHtml}</div></div>`;
  const overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('mousedown', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
  overlay.addEventListener('keydown', trapModalTab);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function getModalFocusable() {
  const card = document.querySelector('#modal-overlay .modal-card');
  if (!card) return [];
  return Array.from(card.querySelectorAll('input, select, textarea, button, a[href], [tabindex]'))
    .filter(el => !el.disabled && el.tabIndex !== -1 && el.offsetParent !== null);
}
function trapModalTab(e) {
  if (e.key !== 'Tab') return;
  const focusable = getModalFocusable();
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

   표준 HTML 이벤트 핸들러 속성이 아니라 인라인으로는 못 걸리므로 JS로 직접 등록. */

    if (!children.length) return '';

  cpState.items = items;

  const name = document.getElementById('pv-name').value.trim();
  if (!name) return showToast('이름을 입력해주세요.', 'error');
  if (list.some((x) => x.id !== id && x.name === name)) return showToast('이미 등록된 이름이에요.', 'error');

        const tokens = tagNameTokens(c[field]);

let vsState = null;
function openVendorSuggest(input, field, nextFieldId) {
  bindCompositionEndOnce(input, onVendorInput);
  if (vsState && vsState.input === input) return;
  closeAllSearchPopups();
  const pop = document.createElement('div');
  pop.className = 'cp-pop';
  document.body.appendChild(pop);
  vsState = { input, pop, items: [], activeIndex: -1, field: field || 'vendor', nextFieldId: nextFieldId || null };
  renderVendorSuggest();
  positionVendorSuggest();
  setTimeout(() => document.addEventListener('mousedown', onVendorSuggestOutsideClick), 0);

}
function onVendorSuggestScroll(e) {
  if (vsState && vsState.pop.contains(e.target)) return;
  closeVendorSuggest();
}
function onVendorInput(input) {
  if (!vsState || vsState.input !== input) { openVendorSuggest(input); return; }
  renderVendorSuggest();
  /* 일부 브라우저(예: 아이패드 Safari 가상 키보드)는 한글 조합이 끝나도
     compositionend가 안정적으로 안 와서 목록이 조합 중간 글자에 멈춰있을 수
     있어요. 타이핑이 잠깐 멈춘 뒤 한 번 더 최신 값으로 갱신해서 맞춰줘요. */
  clearTimeout(vsState.settleTimer);
  vsState.settleTimer = setTimeout(() => { if (vsState && vsState.input === input) renderVendorSuggest(); }, 200);
}
function positionVendorSuggest() {
  if (!vsState) return;
  const rect = vsState.input.getBoundingClientRect();
  const top = Math.min(rect.bottom + 4, window.innerHeight - 220);
  const left = Math.min(rect.left, window.innerWidth - Math.max(220, rect.width) - 8);
  vsState.pop.style.top = Math.max(8, top) + 'px';
  vsState.pop.style.left = Math.max(8, left) + 'px';
  vsState.pop.style.width = Math.min(Math.max(220, rect.width), window.innerWidth - 16) + 'px';
}
function renderVendorSuggest() {
  if (!vsState) return;
  const q = vsState.input.value.trim().toLowerCase();
  const registryNames = payeeVendorList(vsState.field).map((x) => x.name);
  const historyNames = TAG_KIND_MULTI[vsState.field]

function onVendorKeydown(e) {
  if (!vsState) return;

    highlightActiveVendorItem();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();

    vsState.activeIndex = vsState.activeIndex <= 0 ? items.length - 1 : vsState.activeIndex - 1;
    highlightActiveVendorItem();

    if (vsState.activeIndex >= 0 && items[vsState.activeIndex] != null) {

    if (vsState.activeIndex >= 0 && items[vsState.activeIndex] != null) { e.preventDefault(); pickVendorSuggest(vsState.activeIndex); }

  }
}
function pickVendorSuggest(idx) {

function onVendorSuggestOutsideClick(e) {

}
function closeVendorSuggest() {

  window.removeEventListener('resize', positionVendorSuggest);

  vsState = null;
}

/* ---------------- swipe left/right to move the month/year nav (mobile) ---------------- */
(function setupSwipeNav() {
  let sx = 0, sy = 0, st = 0, active = false;
  document.addEventListener('touchstart', (e) => {
    active = false;
    if (e.touches.length !== 1) return;
    if (document.getElementById('modal-root').children.length) return;
    if (e.target.closest('.overflow-x')) return;
    if (!document.querySelector('.panel.active .month-nav')) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
    active = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!active) return;
    active = false;
    const t = e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Date.now() - st > 600 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    const nav = document.querySelector('.panel.active .month-nav');
    if (!nav) return;
    const [prevBtn, nextBtn] = nav.querySelectorAll('.icon-btn');
    if (dx < 0 && nextBtn) nextBtn.click();
    else if (dx > 0 && prevBtn) prevBtn.click();
  }, { passive: true });
})();

function formatAmountInput(el) {
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}
function rawAmount(el) { return Number(String(el.value).replace(/[^0-9]/g, '')) || 0; }
function formatSignedAmountInput(el) {
  const neg = el.value.trim().startsWith('-');
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = (neg ? '-' : '') + (digits ? Number(digits).toLocaleString('ko-KR') : '');
}
function rawSignedAmount(el) {
  const v = String(el.value);
  const neg = v.trim().startsWith('-');
  const n = Number(v.replace(/[^0-9]/g, '')) || 0;
  return neg ? -n : n;
}
function formatCurrencyAmountInput(el, currency, allowNegative) {
  if (currency !== 'USD') { if (allowNegative) formatSignedAmountInput(el); else formatAmountInput(el); return; }
  const neg = allowNegative && el.value.trim().startsWith('-');
  let v = el.value.replace(/[^0-9.]/g, '');
  const firstDot = v.indexOf('.');
  if (firstDot !== -1) v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
  const [intPartRaw, decPartRaw] = v.split('.');
  const intPart = (intPartRaw || '').replace(/^0+(?=\d)/, '');
  const intFormatted = intPart ? Number(intPart).toLocaleString('en-US') : '';
  const hasDot = v.includes('.');
  el.value = (neg ? '-' : '') + intFormatted + (hasDot ? '.' + (decPartRaw || '').slice(0, 2) : '');
}
function rawCurrencyAmount(el, currency, allowNegative) {
  if (currency !== 'USD') return allowNegative ? rawSignedAmount(el) : rawAmount(el);
  const v = String(el.value);
  const neg = allowNegative && v.trim().startsWith('-');
  const n = Number(v.replace(/[^0-9.]/g, '')) || 0;
  return neg ? -n : n;
}

function buildCalendarCells(mKey) {
  const [y, m] = mKey.split('-').map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const startOffset = firstDay.getDay();
  const total = daysInMonth(y, m);
  const prevKey = shiftMonth(mKey, -1);
  const [py, pm] = prevKey.split('-').map(Number);
  const prevTotal = daysInMonth(py, pm);
  const nextKey = shiftMonth(mKey, 1);
  const cells = [];
  for (let i = startOffset; i > 0; i--) {
    cells.push({ date: `${prevKey}-${pad2(prevTotal - i + 1)}`, inMonth: false });
  }
  for (let d = 1; d <= total; d++) cells.push({ date: `${mKey}-${pad2(d)}`, inMonth: true });
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: `${nextKey}-${pad2(nextDay)}`, inMonth: false });
    nextDay++;
  }
  return cells;
}

/* ---------------- TRANSACTIONS ---------------- */
function renderTxTable(list, hideDate, showCategoryCol) {
  const sortState = showCategoryCol ? state._txSort : null;
  const th = (key, label, style) => showCategoryCol
    ? `<th class="dcol sortable-th" style="${style || ''}" onclick="setTxSort('${key}')" title="클릭하여 정렬">${label}${sortArrowHtml(sortState, key)}</th>`

    <thead><tr>
      ${hideDate ? '' : (showCategoryCol ? `<th class="sortable-th" style="width:64px;" onclick="setTxSort('date')" title="클릭하여 정렬">날짜${sortArrowHtml(sortState, 'date')}</th>` : '<th style="width:64px;">날짜</th>')}
      <th class="name-cell mcol">내역</th>
      ${th('type', '구분', 'width:64px;')}
      ${th('account', '계좌', 'width:130px;')}

      ${th('memo', '메모')}

      ${th('vendor', '거래처', 'width:90px;')}

      <th class="actions-cell tx-actions-cell">관리</th>
    </tr></thead>
    <tbody>
      ${list.map((t, i) => {
        const dayBoundary = list[i + 1] && list[i + 1].date !== t.date;
        const acc = getAccount(t.accountId);
        const typeLabel = t.type === 'income' ? '수입' : t.type === 'expense' ? '지출' : '이체';
        let mid, acctCell;
        if (t.type === 'transfer') {

          mid = `${cat.icon} ${escapeHtml(cat.name)} <span style="color:var(--ink-faint)">· ${escapeHtml(acc.name)}</span>`;
          acctCell = `${acc.icon} ${escapeHtml(acc.name)}`;

        const catChildCell = categoryChildCellHtml(t.categoryId);

        const subParts = [];
        if (t.payee) subParts.push(`<span style="font-weight:600;">${escapeHtml(t.payee)}</span>`);
        if (t.vendor) subParts.push(`<span style="font-weight:600;">${escapeHtml(t.vendor)}</span>`);
        if (t.memo) subParts.push(escapeHtml(t.memo));
        const subLine = subParts.length || (t.receiptIds && t.receiptIds.length) || t.excludeFromStats
          ? `<div class="name-cell" style="font-size:11px;color:var(--ink-faint);margin-top:2px;">${subParts.join(' · ')}${receiptBadge(t)}${excludeFromStatsBadge(t)}</div>`
          : '';
        const memoParts = [];
        if (t.memo) memoParts.push(escapeHtml(t.memo));
        const memoCell = memoParts.join(' · ') + receiptBadge(t) + excludeFromStatsBadge(t);
        const isEditing = showCategoryCol && state._txModal && state._txModal.renderMode === 'inline' && state._txModal.txId === t.id;
        return `<tr class="tx-row-clickable ${dayBoundary ? 'day-boundary' : ''} ${isEditing ? 'row-editing' : ''}" data-txid="${t.id}" onclick="onTxRowClick(event, '${t.id}')">
          ${hideDate ? '' : `<td>${t.date.slice(5)}</td>`}

            <div class="name-cell"><span class="type-tag ${t.type}">${typeLabel}</span> ${mid}</div>

}

/* 목록 헤더 클릭 정렬 공용 헬퍼 */
function sortArrowHtml(sortState, key) {
  if (!sortState || sortState.key !== key) return '';
  return `<span class="sort-arrow">${sortState.dir === 'asc' ? '▲' : '▼'}</span>`;
}
function toggleSortState(sortState, key) {
  if (sortState && sortState.key === key) return { key, dir: sortState.dir === 'asc' ? 'desc' : 'asc' };
  return { key, dir: 'asc' };
}
function compareSortValues(va, vb) {
  if (va == null && vb == null) return 0;
  if (va == null) return 1;
  if (vb == null) return -1;
  if (typeof va === 'number' && typeof vb === 'number') return va - vb;
  return String(va).localeCompare(String(vb), 'ko');
}
function txSortKeyValue(t, key) {
  switch (key) {
    case 'date': return t.date;
    case 'type': return t.type === 'income' ? '수입' : t.type === 'expense' ? '지출' : '이체';
    case 'account': return (getAccount(t.accountId) || {}).name || '';
    case 'catParent': { const v = categoryParentCellText(t.categoryId); return v === '-' ? '' : v; }
    case 'catChild': { const v = categoryChildCellText(t.categoryId); return v === '-' ? '' : v; }
    case 'memo': return t.memo || '';
    case 'payee': return t.payee || '';
    case 'vendor': return t.vendor || '';
    case 'amount': return t.amount;
    case 'balance': return t.balance;
    default: return '';
  }
}
function sortTxList(list, sortState) {
  if (!sortState) return list;
  const { key, dir } = sortState;
  return list.slice().sort((a, b) => {
    const cmp = compareSortValues(txSortKeyValue(a, key), txSortKeyValue(b, key));
    return dir === 'asc' ? cmp : -cmp;
  });
}
function setTxSort(key) {
  state._txSort = toggleSortState(state._txSort, key);
  renderTransactions();
}
function receiptBadge(t) {
  const n = (t.receiptIds || []).length;
  if (!n) return '';
  return ' 🧾' + (n > 1 ? `×${n}` : '');
}
function excludeFromStatsBadge(t) {
  if (!t.excludeFromStats) return '';
  return ' <input type="checkbox" checked disabled title="통계/예산 계산에서 제외" style="accent-color:#2a78d6;width:13px;height:13px;vertical-align:middle;">';
}
function txSearchText(t) {
  const acc = getAccount(t.accountId);
  const typeLabel = t.type === 'income' ? '수입' : t.type === 'expense' ? '지출' : '이체';
  const parts = [t.memo || '', t.payee || '', t.vendor || '', acc ? acc.name : '', typeLabel, t.date];
  if (t.type === 'transfer') {
    const toAcc = getAccount(t.toAccountId);
    if (toAcc) parts.push(toAcc.name);
  } else {
    const cat = getCategory(t.categoryId);
    parts.push(cat.name);
    if (cat.parentId) parts.push(getCategory(cat.parentId).name);
  }
  parts.push(String(t.amount));
  return parts.join(' ').toLowerCase();
}
function navTxPeriod(delta) {
  if (state.txPeriod === 'year') {
    const [y, m] = state.txMonth.split('-');
    state.txMonth = (Number(y) + delta) + '-' + m;
  } else {
    state.txMonth = shiftMonth(state.txMonth, delta);
  }
  renderTransactions();
}
function jumpTxToday() {
  state.txMonth = monthKey(new Date());
  state.txPeriod = 'month';
  renderTransactions();
}
function navTxToMonth(value) {
  if (!value) return;
  state.txMonth = value;
  renderTransactions();
}
function setTxPeriod(p) {
  state.txPeriod = p;
  renderTransactions();
}
function txPeriodSegHtml(period) {
  return `
    <button type="button" class="ghost-btn ${period === 'year' ? 'acct-seg-active' : ''}" style="font-size:12px;padding:5px 10px;" onclick="setTxPeriod('year')">올해</button>

}
function txYearNavHtml(mKey, extraButtons) {

    <button class="icon-btn" onclick="navTxPeriod(-1)" aria-label="이전 해">&lt;</button>
    <div class="m-label" title="연도를 선택하려면 클릭하세요" onclick="openMonthPicker(this, '${mKey}', 'navTxToMonth')">${year}년</div>

function renderTransactions() {
  const mKey = state.txMonth;
  const period = state.txPeriod || 'month';
  const f = state.txFilter;
  let list = txInPeriod(period, mKey);
  if (f.type !== 'all') list = list.filter(t => t.type === f.type);
  if (f.categoryId) list = list.filter(t => t.categoryId === f.categoryId);
  else if (f.parentCategoryId) list = list.filter(t => { const c = getCategory(t.categoryId); return c && c.parentId === f.parentCategoryId; });
  if (f.accountId) list = list.filter(t => t.accountId === f.accountId || t.toAccountId === f.accountId);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => txSearchText(t).includes(q)); }
  list = state._txSort ? sortTxList(list, state._txSort) : list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

  const catTypesForFilter = f.type === 'all' ? ['expense', 'income'] : [f.type];
  const catOptions = catTypesForFilter.map(type => {
    const groups = topCategories(type).map(p => {
      const children = childCategories(p.id);
      if (!children.length) return '';
      return `<optgroup label="${escapeHtml(p.icon + ' ' + p.name)}">${children.map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</optgroup>`;

    return groups;

  const periodSegHtml = txPeriodSegHtml(period);

    : period === 'year' ? txYearNavHtml(mKey, periodSegHtml)
    : monthNavHtml('navTxPeriod(-1)', 'navTxPeriod(1)', mKey, { onToday: 'jumpTxToday()', onPick: 'navTxToMonth', extraButtons: periodSegHtml });
  const periodLabel = period === 'all' ? '전체 기간' : period === 'year' ? `${mKey.slice(0, 4)}년` : monthLabel(mKey);

  document.getElementById('panel-transactions').innerHTML = `
    <div class="tx-split">
      <div class="tx-split-main" onclick="onTxMainClick(event)">
        ${periodNav}
        <div class="toolbar">
          <div class="btn-group">
            <select id="f-type" style="width:100px;" onchange="onFilterChange()">
              <option value="all" ${f.type === 'all' ? 'selected' : ''}>전체</option>
              <option value="expense" ${f.type === 'expense' ? 'selected' : ''}>지출</option>
              <option value="income" ${f.type === 'income' ? 'selected' : ''}>수입</option>
              <option value="transfer" ${f.type === 'transfer' ? 'selected' : ''}>이체</option>
            </select>
            <select id="f-category" style="width:150px;" onchange="onFilterChange()">
              <option value="">전체 카테고리</option>${catOptions}
            </select>
            <select id="f-account" style="width:130px;" onchange="onFilterChange()">
              <option value="">전체 자산</option>${DATA.accounts.map(a => `<option value="${a.id}" ${f.accountId === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}
            </select>
          </div>
          <div class="search-wrap" style="max-width:320px;display:flex;gap:6px;">
            <input class="search-input" id="f-q" placeholder="전체 내용 검색" value="${escapeHtml(f.q)}" onkeydown="onTxSearchKeydown(event)" style="flex:1;min-width:0;">
            <button class="ghost-btn" onclick="runTxSearch()" style="flex-shrink:0;">검색</button>
          </div>
          <div class="btn-group">

          </div>
        </div>
        <div class="form-note">${periodLabel} · ${list.length}건</div>
        ${list.length ? renderTxTable(list, false, true) : `<div class="empty"><div class="big">조건에 맞는 거래가 없어요</div>필터를 바꾸거나 새 거래를 추가해보세요.</div>`}
      </div>
      <div class="tx-inline-panel" id="tx-inline-slot-transactions"></div>
    </div>
  `;
}
function onFilterChange() {

/* ---------------- receipt photo storage (IndexedDB locally, Supabase Storage in the cloud) ----------------
   localStorage is capped at ~5-10MB per origin, and receipt photos are the single
   biggest thing this app stores. Photos live in IndexedDB locally (typically hundreds
   of MB+ available), each keyed by its own receipt id; DATA.transactions only keeps a
   lightweight receiptIds array (the tx's first photo reuses the tx id as its key for
   backward compatibility, additional photos get freshly minted ids), so the localStorage
   payload stays small. Each photo is also uploaded once, at save time, to the "receipts"
   Supabase Storage bucket (path "<user id>/<receipt id>.jpg") so it survives across
   devices without being re-uploaded on every unrelated save the way embedding it in the
   synced jsonb blob would require. */
const RECEIPT_DB_NAME = 'household-ledger-receipts';
const RECEIPT_STORE = 'receipts';
const RECEIPT_BUCKET = 'receipts';
let receiptDBPromise = null;
function openReceiptDB() {
  if (receiptDBPromise) return receiptDBPromise;
  receiptDBPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(RECEIPT_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(RECEIPT_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return receiptDBPromise;
}
function putReceiptLocal(id, dataUrl) {
  return openReceiptDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(RECEIPT_STORE, 'readwrite');
    tx.objectStore(RECEIPT_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function getReceiptLocal(id) {
  return openReceiptDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(RECEIPT_STORE, 'readonly');
    const req = tx.objectStore(RECEIPT_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function deleteReceiptLocal(id) {
  return openReceiptDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(RECEIPT_STORE, 'readwrite');
    tx.objectStore(RECEIPT_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function receiptStoragePath(id) { return `${currentUserId}/${id}.jpg`; }
function dataURLToBlob(dataUrl) {
  return fetch(dataUrl).then(r => r.blob());
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function uploadReceiptToCloud(id, dataUrl) {
  if (!sb || !currentUserId) return;
  try {
    const blob = await dataURLToBlob(dataUrl);
    const { error } = await sb.storage.from(RECEIPT_BUCKET).upload(receiptStoragePath(id), blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) console.error('receipt cloud upload failed', id, error);
  } catch (e) { console.error('receipt cloud upload failed', id, e); }
}
async function downloadReceiptFromCloud(id) {
  if (!sb || !currentUserId) return null;
  try {
    const { data, error } = await sb.storage.from(RECEIPT_BUCKET).download(receiptStoragePath(id));
    if (error || !data) return null;
    return await blobToDataURL(data);
  } catch (e) { console.error('receipt cloud download failed', id, e); return null; }
}
function deleteReceiptFromCloud(id) {
  if (!sb || !currentUserId) return Promise.resolve();
  return sb.storage.from(RECEIPT_BUCKET).remove([receiptStoragePath(id)]).catch(e => console.error('receipt cloud delete failed', id, e));
}
async function putReceipt(id, dataUrl) {
  await putReceiptLocal(id, dataUrl);
  uploadReceiptToCloud(id, dataUrl).catch(() => {});
}
async function getReceipt(id) {
  const local = await getReceiptLocal(id).catch(() => null);
  if (local) return local;
  const cloudVal = await downloadReceiptFromCloud(id);
  if (cloudVal) { try { await putReceiptLocal(id, cloudVal); } catch (e) {} }
  return cloudVal;
}
function deleteReceipt(id) {
  deleteReceiptFromCloud(id).catch(() => {});
  return deleteReceiptLocal(id);
}
async function migrateReceiptsToIndexedDB() {
  const toMigrate = DATA.transactions.filter(t => typeof t.receipt === 'string' && t.receipt.startsWith('data:'));
  if (!toMigrate.length) return false;
  for (const t of toMigrate) {
    try { await putReceipt(t.id, t.receipt); t.receiptIds = [t.id]; } catch (e) { console.error('receipt migration failed', t.id, e); }
    delete t.receipt;
  }
  return true;
}
async function backfillReceiptsToCloud() {
  if (!sb || !currentUserId || (DATA.settings && DATA.settings.receiptsBackfilledToCloud)) return false;
  for (const t of DATA.transactions) {
    for (const rid of (t.receiptIds || [])) {
      const local = await getReceiptLocal(rid).catch(() => null);
      if (local) await uploadReceiptToCloud(rid, local);
    }
  }
  DATA.settings.receiptsBackfilledToCloud = true;
  return true;
}
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1000; quality = quality || 0.6;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onReceiptFileChange(input) {
  const files = Array.from(input.files || []);

    try {

      state._txModal.receipts.push({ id: null, dataUrl, loading: false });
    } catch (e) {
      showToast('사진을 처리하는 중 문제가 생겼어요.', 'error');
    }

  const memo = document.getElementById('tx-memo').value.trim();
  if (!date) return showToast('날짜를 선택해주세요.', 'error');
  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  let payload = { type, date, amount, memo, payee: undefined, vendor: undefined };
  if (type === 'transfer') {
    const categoryId = document.getElementById('tx-category').value;
    const accountId = document.getElementById('tx-account').value;
    const toAccountId = document.getElementById('tx-toaccount').value;
    if (!categoryId) return showToast('카테고리가 없어요. 설정에서 먼저 추가해주세요.', 'error');
    if (!accountId || !toAccountId) return showToast('자산을 선택해주세요.', 'error');
    if (accountId === toAccountId) return showToast('출금 자산과 입금 자산이 같을 수 없어요.', 'error');
    if ((getAccount(accountId).currency || 'KRW') !== (getAccount(toAccountId).currency || 'KRW')) return showToast('통화가 다른 자산 간 이체는 아직 지원하지 않아요.', 'error');
    payload.categoryId = categoryId; payload.accountId = accountId; payload.toAccountId = toAccountId;
  } else {
    const categoryId = document.getElementById('tx-category').value;
    const accountId = document.getElementById('tx-account').value;
    if (!categoryId) return showToast('카테고리가 없어요. 설정에서 먼저 추가해주세요.', 'error');
    if (!accountId) return showToast('자산이 없어요. 자산 탭에서 먼저 추가해주세요.', 'error');
    payload.categoryId = categoryId; payload.accountId = accountId;
    payload.excludeFromStats = document.getElementById('tx-exclude').checked;
    const loanEl = document.getElementById('tx-loan-account');
    const linkedLoanAccountId = type === 'expense' && loanEl ? (loanEl.value || null) : null;
    if (linkedLoanAccountId && (getAccount(linkedLoanAccountId).currency || 'KRW') !== (getAccount(accountId).currency || 'KRW')) {
      return showToast('대출/할부 계좌와 지출 자산의 통화가 달라 연결할 수 없어요.', 'error');
    }
    payload.linkedLoanAccountId = type === 'expense' ? linkedLoanAccountId : undefined;
  }
  payload.payee = document.getElementById('tx-payee').value.trim() || null;
  payload.vendor = document.getElementById('tx-vendor').value.trim() || null;
  registerPayeeIfNew(payload.payee);
  registerVendorIfNew(payload.vendor);

  const txId = editId || uid();
  const originalReceiptIds = editId ? ((DATA.transactions.find(t => t.id === editId) || {}).receiptIds || []) : [];
  if (editId) {
    const idx = DATA.transactions.findIndex(t => t.id === editId);
    DATA.transactions[idx] = { ...DATA.transactions[idx], ...payload };
  } else {
    payload.id = txId;
    if (state._txModal.fromRecurringId) payload.fromRecurringId = state._txModal.fromRecurringId;
    DATA.transactions.push(payload);
  }

  const finalReceiptIds = [];
  if (type === 'expense') {
    for (const r of (state._txModal.receipts || [])) {
      if (r.id) { finalReceiptIds.push(r.id); continue; }
      if (!r.dataUrl) continue;
      const newId = `${txId}_${uid()}`;
      try { await putReceipt(newId, r.dataUrl); finalReceiptIds.push(newId); } catch (e) { console.error('receipt save failed', e); }
    }
  }
  const removedReceiptIds = originalReceiptIds.filter(id => !finalReceiptIds.includes(id));
  for (const rid of removedReceiptIds) { try { await deleteReceipt(rid); } catch (e) {} }
  const savedIdx = DATA.transactions.findIndex(t => t.id === txId);
  if (savedIdx >= 0) {
    if (finalReceiptIds.length) DATA.transactions[savedIdx].receiptIds = finalReceiptIds;
    else delete DATA.transactions[savedIdx].receiptIds;
  }

  saveData();
  const wasFromRecurring = state._txModal.fromRecurringId;
  closeTxPanel();
  showToast(editId ? '거래를 수정했어요.' : (wasFromRecurring ? '정기거래를 적용했어요.' : '거래를 추가했어요.'), 'success');
  renderAll();
}
function deleteTx(id) {
  if (!confirm('이 거래를 삭제할까요?')) return false;
  const removed = DATA.transactions.find(t => t.id === id);
  DATA.transactions = DATA.transactions.filter(t => t.id !== id);
  saveData();
  ((removed && removed.receiptIds) || []).forEach((rid) => { deleteReceipt(rid).catch(() => {}); });
  showToast('삭제했어요.', 'info');
  renderAll();
  return true;
}

const BULK_HEADERS = ['날짜(YYYY-MM-DD)', '구분(지출/수입/이체)', '자산(출금)', '입금자산(이체시)', '카테고리(소분류명)', '메모(선택)', '적용대상(선택)', '거래처(선택)', '금액'];
const BULK_TYPE_LABEL = { expense: '지출', income: '수입', transfer: '이체' };
const BULK_TYPE_FROM_LABEL = { '지출': 'expense', '수입': 'income', '이체': 'transfer' };

function normalizeDateString(s) {
  if (s == null) return null;
  s = String(s).trim();
  if (!s) return null;
  const m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
  const n = Number(s);
  if (!isNaN(n) && n > 20000 && n < 90000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) return ymd(d);
  }
  return null;
}
function downloadBulkTemplate() {

  ];

  const wsRef = XLSX.utils.aoa_to_sheet(refRows);

  XLSX.utils.book_append_sheet(wb, wsRef, '참고(카테고리·자산)');

  XLSX.writeFile(wb, `가계부-일괄등록양식-${todayStr()}.xlsx`);
}

async function onBulkFileChange(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  if (!window.XLSX) return showToast('엑셀 라이브러리를 불러오는 중이에요. 잠시 후 다시 시도해주세요.', 'error');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    const dataRows = rows.slice(1).filter(r => r.some(cell => String(cell).trim() !== ''));
    if (!dataRows.length) { showToast('업로드한 파일에 등록할 행이 없어요.', 'error'); return; }
    state._bulkImport.rows = dataRows.map((r, i) => parseBulkRow(r, i));
    renderBulkPreview();
  } catch (e) {
    showToast('엑셀 파일을 읽는 중 문제가 생겼어요. 양식을 확인해주세요.', 'error');
  }
}
function parseBulkRow(row, idx) {
  const [dateRaw, typeRaw, accName, toAccName, catName, memoRaw, payeeRaw, vendorRaw, amountRaw] = row;
  const errors = [];
  const date = normalizeDateString(dateRaw);
  if (!date) errors.push('날짜 형식 오류');
  const type = BULK_TYPE_FROM_LABEL[String(typeRaw || '').trim()];
  if (!type) errors.push('구분은 지출/수입/이체 중 하나여야 해요');
  const amount = Math.round(Number(String(amountRaw || '').replace(/[^0-9.-]/g, '')));
  if (!amount || amount <= 0) errors.push('금액 오류');
  const memo = String(memoRaw || '').trim();
  const payee = String(payeeRaw || '').trim() || null;
  const vendor = String(vendorRaw || '').trim() || null;
  let categoryId = null, accountId = null, toAccountId = null;
  if (type === 'transfer') {
    const cat = DATA.categories.find(c => c.type === 'transfer' && c.parentId && c.name === String(catName || '').trim());
    const acc = DATA.accounts.find(a => a.name === String(accName || '').trim());
    const toAcc = DATA.accounts.find(a => a.name === String(toAccName || '').trim());
    if (!cat) errors.push(`카테고리 없음: ${catName || '(비어있음)'}`);
    if (!acc) errors.push(`출금 자산 없음: ${accName || '(비어있음)'}`);
    if (!toAcc) errors.push(`입금 자산 없음: ${toAccName || '(비어있음)'}`);
    else if (acc && toAcc.id === acc.id) errors.push('출금/입금 자산이 같아요');
    categoryId = cat ? cat.id : null; accountId = acc ? acc.id : null; toAccountId = toAcc ? toAcc.id : null;
  } else if (type) {
    const cat = DATA.categories.find(c => c.type === type && c.parentId && c.name === String(catName || '').trim());
    const acc = DATA.accounts.find(a => a.name === String(accName || '').trim());
    if (!cat) errors.push(`카테고리 없음: ${catName || '(비어있음)'}`);
    if (!acc) errors.push(`자산 없음: ${accName || '(비어있음)'}`);
    categoryId = cat ? cat.id : null; accountId = acc ? acc.id : null;
  }
  return { idx, date, type, amount, categoryId, accountId, toAccountId, payee, vendor, memo, errors };
}

  const rows = state._bulkImport.rows;
  const wrap = document.getElementById('bulk-preview');
  const validCount = rows.filter(r => r.errors.length === 0).length;

function commitBulkImport() {
  const valid = (state._bulkImport.rows || []).filter(r => r.errors.length === 0);
  if (!valid.length) return;
  valid.forEach(r => {
    const payload = { id: uid(), type: r.type, date: r.date, amount: r.amount, memo: r.memo, payee: r.payee, vendor: r.vendor };
    if (r.type === 'transfer') { payload.categoryId = r.categoryId; payload.accountId = r.accountId; payload.toAccountId = r.toAccountId; }
    else { payload.categoryId = r.categoryId; payload.accountId = r.accountId; payload.excludeFromStats = false; }
    DATA.transactions.push(payload);
  });
  saveData();
  closeModal();
  showToast(`${valid.length}건을 일괄 등록했어요.`, 'success');
  renderAll();
}

/* ---------------- STATS ---------------- */
function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function renderPieChart(totals, sum) {
  const cx = 150, cy = 150, r = 140;
  if (!sum) return '';
  if (totals.length === 1) {
    return `<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;display:block;margin:0 auto;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${catColor(totals[0].category)}"/>
      <text x="${cx}" y="${cy}" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">100%</text>
    </svg>`;
  }
  let cumulative = 0;
  const slices = totals.map(c => {
    const startAngle = cumulative / sum * 360;
    cumulative += c.amount;
    const endAngle = cumulative / sum * 360;
    return { ...c, startAngle, endAngle, pct: c.amount / sum };
  });
  const paths = slices.map(s => {
    const [x1, y1] = polarPoint(cx, cy, r, s.startAngle);
    const [x2, y2] = polarPoint(cx, cy, r, s.endAngle);
    const largeArc = s.endAngle - s.startAngle > 180 ? 1 : 0;
    return `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${catColor(s.category)}" stroke="#ffffff" stroke-width="2"/>`;
  }).join('');
  const labels = slices.filter(s => s.pct >= 0.06).map(s => {
    const mid = (s.startAngle + s.endAngle) / 2;
    const [lx, ly] = polarPoint(cx, cy, r * 0.66, mid);
    return `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">${Math.round(s.pct * 100)}%</text>`;
  }).join('');
  return `<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;display:block;margin:0 auto;">${paths}${labels}</svg>`;
}

function accountPeriodProgress(acc) {
  if (!DATE_RANGE_TYPES.includes(acc.type) || !acc.startDate || !acc.endDate) return null;
  if (acc.type === 'savings') {
    const goal = Number(acc.goalAmount) || 0;
    if (!goal) return null;
    const current = Math.max(0, accountBalance(acc));
    return { current, target: goal, pct: Math.min(100, Math.round(current / goal * 100)), label: '적립' };
  }
  const total = Math.abs(Number(acc.initialBalance) || 0);
  if (!total) return null;
  const remaining = Math.abs(accountBalance(acc));
  const paid = Math.min(total, Math.max(0, total - remaining));
  return { current: paid, target: total, pct: Math.min(100, Math.round(paid / total * 100)), label: '상환' };
}
function accountsWithPeriodProgress() {
  return DATA.accounts.map(acc => ({ acc, progress: accountPeriodProgress(acc) })).filter(x => x.progress);
}
function periodBudgetSpent(pb) {
  const [ey, em] = pb.endMonth.split('-').map(Number);
  const start = pb.startMonth + '-01';
  const end = pb.endMonth + '-' + pad2(daysInMonth(ey, em));
  return DATA.transactions
    .filter(t => t.categoryId === pb.categoryId && !t.excludeFromStats && t.date >= start && t.date <= end)
    .reduce((s, t) => s + txAmountKRW(t), 0);
}

function accountMonthFlow(acc, mKey, period) {
  let inflow = 0, outflow = 0;
  txInPeriod(period || 'month', mKey).forEach(t => {
    if (t.type === 'income' && t.accountId === acc.id) inflow += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) outflow += t.amount;
    else if (t.type === 'transfer') {
      if (t.toAccountId === acc.id) inflow += t.amount;
      if (t.accountId === acc.id) outflow += t.amount;
    }
    if (t.type === 'expense' && t.linkedLoanAccountId === acc.id) inflow += t.amount;
  });
  return { inflow, outflow, net: inflow - outflow };
}
function accountRunningBalances(acc) {
  const relevant = DATA.transactions.filter(t => t.accountId === acc.id || t.toAccountId === acc.id || t.linkedLoanAccountId === acc.id)
    .sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
  let bal = Number(acc.initialBalance) || 0;
  const map = {};
  relevant.forEach(t => {
    if (t.type === 'income' && t.accountId === acc.id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) bal -= t.amount;
    else if (t.type === 'transfer') {
      if (t.accountId === acc.id) bal -= t.amount;
      if (t.toAccountId === acc.id) bal += t.amount;
    }
    if (t.type === 'expense' && t.linkedLoanAccountId === acc.id) bal += t.amount;
    map[t.id] = bal;
  });
  return map;
}
function acctTxSortKeyValue(t, key, runningMap) {
  if (key === 'balance') return runningMap[t.id];
  return txSortKeyValue(t, key);
}
function sortAcctTxList(list, sortState, runningMap) {
  if (!sortState) return list;
  const { key, dir } = sortState;
  return list.slice().sort((a, b) => {
    const cmp = compareSortValues(acctTxSortKeyValue(a, key, runningMap), acctTxSortKeyValue(b, key, runningMap));
    return dir === 'asc' ? cmp : -cmp;
  });
}

function submitAccount(editId) {

function deleteAccount(id) {
  const used = accountUsageCount(id);
  if (used > 0) return showToast(`이 자산을 사용하는 거래가 ${used}건 있어 삭제할 수 없어요.`, 'error');
