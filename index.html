<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>

<!-- PWA: 홈 화면에 설치해서 앱처럼 쓸 수 있게 해주는 설정이에요 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f6e56">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1a2420;
    --ink-soft: #56635c;
    --ink-faint: #8a958f;
    --paper: #fbfaf7;
    --paper-raised: #ffffff;
    --line: #dcdcd2;
    --line-soft: #ececE4;
    --accent: #0f6e56;
    --accent-soft: #e1f0ea;
    --accent-tint: #f2f8f5;
    --down: #a32d2d;
    --down-soft: #fcebeb;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --cat-0: #2a78d6; --cat-1: #eb6834; --cat-2: #1baf7a; --cat-3: #c98500;
    --cat-4: #d5588a; --cat-5: #008300; --cat-6: #4a3aa7; --cat-7: #e34948;
    --status-good: #0ca30c; --status-warn: #d98300; --status-crit: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .app { max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-start; }
  .main-content { flex: 1; min-width: 0; padding: 28px 24px 60px; }

  .masthead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .masthead h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; flex-shrink: 0; white-space: nowrap; }
  .masthead .sub { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
  .masthead-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .backup-actions { display: flex; gap: 6px; }
  .backup-actions .ghost-btn { font-size: 12px; padding: 5px 10px; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
  .kpi { background: var(--paper-raised); padding: 10px 12px; }
  .kpi .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; white-space: nowrap; }
  .kpi .val { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .kpi .val.income { color: var(--accent); }
  .kpi .val.expense { color: var(--down); }

  .sidebar { width: 76px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; padding: 20px 6px; border-right: 1px solid var(--line); position: sticky; top: 0; align-self: flex-start; max-height: 100vh; overflow-y: auto; }
  .tab { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-faint); background: none; border: none; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; text-align: center; line-height: 1.2; }
  .tab i { font-size: 19px; }
  .tab.active { color: var(--ink); background: var(--accent-tint); font-weight: 600; }
  .tab:hover:not(.active) { color: var(--ink-soft); background: var(--line-soft); }

  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .toolbar .hint { font-size: 12px; color: var(--ink-faint); }
  .toolbar .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-wrap { flex: 1; max-width: 240px; position: relative; }
  input.search-input { width: 100%; height: 34px; padding: 0 12px 0 30px; font-size: 13px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238a958f" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 8px center; background-size: 14px; }
  input.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.primary-btn { font-family: var(--sans); font-size: 13px; font-weight: 500; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 3px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.primary-btn:hover { background: #000; }
  button.ghost-btn { font-family: var(--sans); font-size: 13px; background: none; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.ghost-btn:hover { background: var(--line-soft); }
  button.icon-btn { font-family: var(--sans); font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 4px 9px; color: var(--ink-soft); margin-left: 4px; }
  button.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  button.icon-btn.danger { color: var(--down); border-color: var(--down-soft); }
  button.icon-btn.danger:hover { background: var(--down-soft); }
  button.icon-btn:disabled { opacity: 0.35; cursor: default; }
  button.icon-btn:disabled:hover { background: none; color: var(--ink-soft); }
  .cat-drag-handle { cursor: grab; touch-action: none; }
  .cat-parent-group.cat-dragging, .cat-chip.cat-dragging { z-index: 9999; box-shadow: 0 6px 18px rgba(0,0,0,0.28); opacity: 0.96; pointer-events: none; }
  .cat-drag-placeholder { border: 2px dashed var(--line); background: var(--line-soft); border-radius: 5px; }
  .cat-child-list .cat-drag-placeholder { margin-bottom: 6px; }
  button.ghost-btn.danger-btn { color: var(--down); border-color: #f0c7c7; }
  button.ghost-btn.danger-btn:hover { background: var(--down-soft); }

  .form-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 16px; }
  .form-card h3 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  .section-heading { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
  input, select, textarea { font-family: var(--sans); font-size: 13px; border: 1px solid var(--line); border-radius: 3px; padding: 0 9px; background: var(--paper); color: var(--ink); width: 100%; }
  input, select { height: 34px; }
  textarea { padding: 9px; min-height: 70px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  input[type="date"], input[type="month"] { -webkit-appearance: none; appearance: none; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .form-note { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .field-lbl { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
  .field { margin-bottom: 12px; }
  .receipt-thumb-wrap { display: flex; align-items: flex-start; gap: 8px; }
  .receipt-thumb { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overflow-x table { table-layout: fixed; min-width: 480px; }
  tbody td { white-space: nowrap; padding: 10px 8px; border-bottom: 1px solid var(--line-soft); overflow: hidden; text-overflow: ellipsis; }
  .name-cell { line-height: 1.35; white-space: normal; overflow: visible; text-overflow: clip; word-break: keep-all; overflow-wrap: break-word; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 4; box-shadow: 0 1px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th.num, td.num { text-align: right; font-family: var(--mono); width: 128px; }
  tbody tr:hover { background: var(--accent-tint); }
  .actions-cell { text-align: right; white-space: normal; overflow: visible; width: 86px; }
  .actions-cell button { padding: 3px 5px !important; margin-left: 2px; font-size: 11px !important; }
  .overflow-x { overflow-x: auto; overflow-y: auto; max-height: 66vh; border-radius: 4px; }
  .empty { text-align: center; padding: 40px 0; color: var(--ink-faint); font-size: 13px; }
  .empty .big { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; }

  .amt.income { color: var(--accent); font-weight: 600; }
  .amt.expense { color: var(--down); font-weight: 600; }
  .amt.transfer { color: var(--ink-soft); font-weight: 600; }
  .type-tag { font-size: 11px; font-family: var(--mono); font-weight: 600; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .type-tag.income { background: var(--accent-soft); color: var(--accent); }
  .type-tag.expense { background: var(--down-soft); color: var(--down); }
  .type-tag.transfer { background: var(--line-soft); color: var(--ink-soft); }
  .ccy-badge { font-size: 10px; font-family: var(--mono); font-weight: 600; padding: 1px 5px; border-radius: 3px; vertical-align: 1px; }
  .ccy-badge.usd { background: var(--accent-soft); color: var(--accent); }

  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { font-family: var(--sans); font-size: 13px; padding: 10px 16px; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 90vw; text-align: center; animation: toast-in 0.2s ease-out; }
  .toast.error { background: #fcebeb; color: #a32d2d; border: 1px solid #f0c7c7; }
  .toast.success { background: var(--accent-soft); color: var(--accent); border: 1px solid #b9dfd0; }
  .toast.info { background: var(--paper-raised); color: var(--ink-soft); border: 1px solid var(--line); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(26,36,32,0.45); z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 20px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; margin: auto; }
  .modal-card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .dp-pop { position: fixed; z-index: 10000; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 10px; width: 250px; }
  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dp-head .dp-label { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-dow { text-align: center; font-size: 10px; color: var(--ink-faint); padding: 2px 0; }
  .dp-cell { text-align: center; font-size: 12px; padding: 6px 0; border-radius: 4px; cursor: pointer; color: var(--ink); }
  .dp-cell:hover { background: var(--line-soft); }
  .dp-cell.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .dp-cell.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .dp-cell.empty { cursor: default; }
  .dp-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  input[type="date"][readonly] { cursor: pointer; background: var(--paper); }

  #auth-gate { position: fixed; inset: 0; background: var(--paper); z-index: 9500; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .auth-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 28px 24px; width: 100%; max-width: 360px; margin: auto; }
  .auth-card h1 { margin: 0 0 4px; font-size: 20px; }
  .auth-card .sub { color: var(--ink-faint); font-size: 13px; margin-bottom: 18px; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 8px; background: var(--paper-raised); border: none; border-right: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink-soft); font-family: var(--sans); }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ink); color: var(--paper); }
  .seg button.active.expense-active { background: var(--down); }
  .seg button.active.income-active { background: var(--accent); }

  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .month-nav .m-label { font-family: var(--mono); font-size: 14px; font-weight: 600; min-width: 96px; text-align: center; position: relative; cursor: pointer; }
  .month-nav .m-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; padding: 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
  .cal-dow { background: var(--paper); text-align: center; font-size: 11px; color: var(--ink-faint); padding: 6px 0; text-transform: uppercase; }
  .cal-cell { background: var(--paper-raised); min-height: 74px; padding: 6px; cursor: pointer; }
  .cal-cell.empty-cell { background: var(--paper); cursor: default; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell.selected { background: var(--accent-tint); }
  .cal-cell:hover:not(.empty-cell) { background: var(--line-soft); }
  .cal-cell .date-num { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .cal-cell .cal-amt { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; }
  .cal-amt.inc { color: var(--accent); }
  .cal-amt.exp { color: var(--down); }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .bar-row .bar-lbl { width: 130px; font-size: 12.5px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-track { flex: 1; height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .bar-val { width: 130px; text-align: right; font-family: var(--mono); font-size: 12px; flex-shrink: 0; }
  .bar-row .bar-pct { width: 44px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .cat-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .pie-legend-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .pie-legend-row .pct-badge { min-width: 44px; text-align: center; padding: 3px 6px; border-radius: 4px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #ffffff; flex-shrink: 0; }
  .pie-legend-row .name { flex: 1; font-size: 13px; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pie-legend-row .amt { font-family: var(--mono); font-size: 13px; font-weight: 600; flex-shrink: 0; }

  .trend-row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .trend-row .trend-m { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .trend-bars { display: flex; flex-direction: column; gap: 3px; }
  .trend-bar-line { display: flex; align-items: center; gap: 6px; }
  .trend-bar-line .trend-track { flex: 1; height: 9px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .trend-bar-line .trend-fill { height: 100%; border-radius: 3px; }
  .trend-bar-line .trend-fill.inc { background: var(--accent); }
  .trend-bar-line .trend-fill.exp { background: var(--down); }
  .trend-bar-line .trend-num { width: 92px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); flex-shrink: 0; }
  .legend-row { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }

  .budget-item { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .budget-group { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 10px; overflow: hidden; }
  .budget-group summary { list-style: none; cursor: pointer; padding: 10px 12px; background: var(--line-soft); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .budget-group summary::-webkit-details-marker { display: none; }
  .budget-group .budget-group-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 400; color: var(--ink-faint); }
  .budget-group .budget-group-meta::after { content: '▸'; transition: transform 0.15s; }
  .budget-group[open] .budget-group-meta::after { transform: rotate(90deg); }
  .budget-group .budget-item { padding: 12px; }
  .budget-group .budget-item:last-child { border-bottom: none; }
  .budget-item .budget-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
  .budget-item .budget-head .left { display: flex; align-items: center; gap: 6px; }
  .budget-item .budget-track { height: 10px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
  .budget-item .budget-fill { height: 100%; border-radius: 5px; }
  .due-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .due-row:last-child { border-bottom: none; }
  .due-row .due-main { min-width: 0; }
  .due-row .due-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .due-row .due-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .due-row .due-amt { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .badge-done { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  .budget-fill.ok { background: var(--status-good); }
  .budget-fill.warn { background: var(--status-warn); }
  .budget-fill.over { background: var(--status-crit); }
  .budget-pct-tag { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; }
  .budget-pct-tag.ok { color: var(--status-good); background: #eaf7ea; }
  .budget-pct-tag.warn { color: var(--status-warn); background: #fbf0e0; }
  .budget-pct-tag.over { color: var(--status-crit); background: var(--down-soft); }
  .budget-edit-input { width: 110px; height: 28px; font-size: 12px; display: inline-block; }

  .acct-master-detail { display: flex; gap: 24px; align-items: flex-start; }
  .acct-list-pane { width: 260px; flex-shrink: 0; }
  .acct-detail-pane { flex: 1; min-width: 0; }
  .acct-list-group { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .acct-list-group-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; padding: 8px 10px; background: var(--line-soft); }
  summary.acct-list-group-head { list-style: none; cursor: pointer; }
  summary.acct-list-group-head::-webkit-details-marker { display: none; }
  summary.acct-list-group-head .acct-group-toggle::after { content: '▾'; color: var(--ink-faint); font-size: 10px; margin-left: 6px; }
  details.acct-list-group[open] summary.acct-list-group-head .acct-group-toggle::after { content: '▴'; }
  .acct-list-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; cursor: pointer; font-size: 13px; border-top: 1px solid var(--line-soft); }
  .acct-list-row:hover { background: var(--line-soft); }
  .acct-list-row.selected { background: var(--accent-tint); font-weight: 600; }
  .acct-list-row.excluded { opacity: 0.6; }

function authErrorMessage(msg) {
  if (/Invalid login credentials/i.test(msg)) return '이메일 또는 비밀번호가 올바르지 않아요.';
  if (/already registered|already exists/i.test(msg)) return '이미 가입된 이메일이에요. 로그인해주세요.';
  if (/Password should be|password.*least/i.test(msg)) return '비밀번호는 6자 이상이어야 해요.';
  if (/Email not confirmed/i.test(msg)) return '이메일 인증이 필요해요. 받은 메일함을 확인해주세요.';
  if (/rate limit/i.test(msg)) return '요청이 너무 많아요. 잠시 후 다시 시도해주세요.';
  return msg || '알 수 없는 오류가 발생했어요.';
}
async function submitAuth() {
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!sb) { errEl.textContent = '로그인 서비스에 연결할 수 없어요. 네트워크를 확인해주세요.'; errEl.style.display = 'block'; return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true;
  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await onAuthed(data.user.id);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) {
        await onAuthed(data.user.id);
      } else {
        errEl.style.color = 'var(--accent)';
        errEl.textContent = '가입 확인 이메일을 보냈어요. 메일함에서 인증 후 로그인해주세요.';
        errEl.style.display = 'block';
        setAuthMode('login');
      }
    }
  } catch (e) {
    errEl.style.color = 'var(--down)';
    errEl.textContent = authErrorMessage(e.message);
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}
async function loadCloudData(userId) {
  const { data, error } = await sb.from('user_data').select('data').eq('user_id', userId).maybeSingle();
  if (error) { console.error('cloud load failed', error); return { ok: false }; }
  return { ok: true, data: data ? data.data : undefined };
}
function scheduleCloudSave() {
  if (!sb || !currentUserId) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(() => {
    sb.from('user_data').upsert({ user_id: currentUserId, data: DATA, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) console.error('cloud save failed', error); });
  }, 800);
}
async function onAuthed(userId) {
  currentUserId = userId;
  const { data: { user } } = await sb.auth.getUser();
  try {
    const result = await loadCloudData(userId);
    if (result.ok && result.data === undefined) {
      await sb.from('user_data').upsert({ user_id: userId, data: DATA, updated_at: new Date().toISOString() });
    } else if (result.ok && result.data && Array.isArray(result.data.categories) && result.data.categories.length) {
      let cloudData = result.data;
      cloudData.transactions = cloudData.transactions || [];
      cloudData.budgets = cloudData.budgets || {};
      cloudData.recurring = cloudData.recurring || [];
      cloudData = migrateCategoriesToHierarchy(cloudData);

      DATA = cloudData;
      try { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); } catch (e) {}
      if (beforeVersion !== CATEGORY_TREE_VERSION) scheduleCloudSave();
    }
  } catch (e) {
    console.error('cloud sync on login failed', e);
  }
  startApp(user ? user.email : '');
}
function signOut() {

async function initAuthFlow() {

    else document.getElementById('auth-gate').style.display = 'flex';
  } catch (e) {
    console.error(e);
    document.getElementById('auth-gate').style.display = 'flex';
  }
}

/* ---------------- 한국 공휴일(음력 포함) 자동 계산 ----------------
   브라우저의 Intl 음력(chinese) 캘린더로 설날/추석/부처님오신날의 양력 날짜를 매년 계산하고,
   대체공휴일 규정(신정·현충일 제외, 주말과 겹치면 다음 평일에 하루를 더 지정)을 적용해요.
   회사 임시 휴무일처럼 이 계산에 없는 날짜는 설정 > 공휴일 관리에서 직접 추가할 수 있어요. */
function _addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function _isWeekendDate(d) { const w = d.getDay(); return w === 0 || w === 6; }
function _lunarMonthDay(date) {
  try {
    const parts = new Intl.DateTimeFormat('en-u-ca-chinese', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(date);
    return { month: Number(parts.find(p => p.type === 'month').value), day: Number(parts.find(p => p.type === 'day').value) };
  } catch (e) { return null; }
}
function _findLunarDate(gYear, lunarMonth, lunarDay, searchStartMonth, searchStartDay, rangeDays) {
  const start = new Date(gYear, searchStartMonth - 1, searchStartDay);
  for (let i = 0; i < rangeDays; i++) {
    const d = _addDays(start, i);
    const lm = _lunarMonthDay(d);
    if (lm && lm.month === lunarMonth && lm.day === lunarDay) return d;
  }
  return null;
}
function krHolidaysForYear(y) {
  const singles = [
    { date: new Date(y, 0, 1), subEligible: false },  // 신정
    { date: new Date(y, 2, 1), subEligible: true },   // 삼일절
    { date: new Date(y, 4, 5), subEligible: true },   // 어린이날
    { date: new Date(y, 5, 6), subEligible: false },  // 현충일
    { date: new Date(y, 7, 15), subEligible: true },  // 광복절
    { date: new Date(y, 9, 3), subEligible: true },   // 개천절
    { date: new Date(y, 9, 9), subEligible: true },   // 한글날
    { date: new Date(y, 11, 25), subEligible: true }, // 성탄절(크리스마스)
  ];
  const seol = _findLunarDate(y, 1, 1, 1, 10, 55);     // 설날 (음력 1/1)
  const buddha = _findLunarDate(y, 4, 8, 4, 5, 60);    // 부처님오신날 (음력 4/8)
  const chu = _findLunarDate(y, 8, 15, 8, 25, 50);     // 추석 (음력 8/15)
  if (buddha) singles.push({ date: buddha, subEligible: true });
  const seollalGroup = seol ? [-1, 0, 1].map(o => _addDays(seol, o)) : [];
  const chuseokGroup = chu ? [-1, 0, 1].map(o => _addDays(chu, o)) : [];

  const allDates = singles.map(s => s.date).concat(seollalGroup, chuseokGroup);
  const baseSet = new Set(allDates.map(ymd));
  const subs = [];
  const addSub = (afterDate) => {
    let d = _addDays(afterDate, 1);
    while (_isWeekendDate(d) || baseSet.has(ymd(d)) || subs.some(s => ymd(s) === ymd(d))) d = _addDays(d, 1);
    subs.push(d);
  };
  singles.forEach(({ date, subEligible }) => { if (subEligible && _isWeekendDate(date)) addSub(date); });
  if (seollalGroup.length && seollalGroup.some(_isWeekendDate)) addSub(seollalGroup[2]);
  if (chuseokGroup.length && chuseokGroup.some(_isWeekendDate)) addSub(chuseokGroup[2]);

  return allDates.concat(subs);
}
const _krHolidayCache = {};
function krHolidaySetForYear(y) {
  if (!_krHolidayCache[y]) _krHolidayCache[y] = new Set(krHolidaysForYear(y).map(ymd));
  return _krHolidayCache[y];
}

/* 구버전(대/소분류 구분 없는 평평한 카테고리) 데이터를 대분류 트리 밑으로 옮겨요.
   이름이 기본 카테고리와 일치하면 해당 대분류로, 아니면(사용자가 직접 추가한 카테고리) '기타'로 보내요. */
function migrateCategoriesToHierarchy(d) {
  if (d.categorySchema === 2) return d;
  const leafToGroup = {};
  ['expense', 'income'].forEach((type) => {
    CATEGORY_TREE[type].forEach((group) => {
      group.children.forEach(([name]) => { leafToGroup[type + ':' + name] = group; });
    });
  });
  const fallback = {
    expense: CATEGORY_TREE.expense.find((g) => g.name === '기타'),
    income: CATEGORY_TREE.income.find((g) => g.name === '용돈/기타수입'),
  };
  const parentIdByKey = {};
  const migrated = [];
  (d.categories || []).forEach((cat) => {
    if (cat.parentId) { migrated.push(cat); return; }
    const group = leafToGroup[cat.type + ':' + cat.name] || fallback[cat.type] || fallback.expense;
    const key = cat.type + ':' + group.name;
    if (!parentIdByKey[key]) {
      const pid = uid();
      parentIdByKey[key] = pid;
      migrated.push({ id: pid, type: cat.type, name: group.name, icon: group.icon, parentId: null });
    }
    migrated.push({ ...cat, parentId: parentIdByKey[key] });
  });
  d.categories = migrated;
  d.categorySchema = 2;
  return d;
}

function migrateAccountTypes(d) {
  (d.accounts || []).forEach((a) => {
    if (!ACC_TYPES.includes(a.type)) { a.type = a.type === 'card' ? 'installment' : 'other'; a.icon = ACC_TYPE_ICON[a.type]; }
    if (a.currency !== 'USD') a.currency = 'KRW';
  });
  return d;
}

/* 카테고리 대분류/소분류 목록을 CATEGORY_TREE의 최신 구성으로 통째로 교체해요(한 번만 실행).
   기존에 쓰던 카테고리는 이 최신 목록엔 없는 이름들이라 그대로 옮길 수 없어서,
   그 카테고리가 달려있던 거래/예산/정기거래는 전부 각 타입의 '기타' 카테고리로 옮겨요. */
const CATEGORY_TREE_VERSION = 1;
function migrateToUpdatedCategoryTree(d) {
  if (d.categoryTreeVersion === CATEGORY_TREE_VERSION) return d;
  const oldTypeById = {};
  (d.categories || []).forEach((c) => { oldTypeById[c.id] = c.type; });

  const categories = [];
  const colorCounter = { expense: 0, income: 0 };
  const fallbackLeafId = {};
  ['expense', 'income'].forEach((type) => {
    CATEGORY_TREE[type].forEach((group) => {
      const parentId = uid();
      categories.push({ id: parentId, type, name: group.name, icon: group.icon, parentId: null });
      group.children.forEach(([name, icon]) => {
        const leafId = uid();
        categories.push({ id: leafId, type, name, icon, parentId, colorIdx: colorCounter[type]++ % 8 });
        if (group.name === '기타' && name === '기타') fallbackLeafId[type] = leafId;
      });
    });
  });

  (d.transactions || []).forEach((t) => {
    const type = oldTypeById[t.categoryId] || t.type;
    if (fallbackLeafId[type]) t.categoryId = fallbackLeafId[type];
  });
  (d.recurring || []).forEach((r) => {
    if (r.categoryId == null) return;
    const type = oldTypeById[r.categoryId] || r.type;
    if (fallbackLeafId[type]) r.categoryId = fallbackLeafId[type];
  });
  const migratedBudgets = {};
  Object.entries(d.budgets || {}).forEach(([catId, amt]) => {
    const fallbackId = fallbackLeafId.expense;
    if (fallbackId) migratedBudgets[fallbackId] = (migratedBudgets[fallbackId] || 0) + amt;
  });

  d.categories = categories;
  d.budgets = migratedBudgets;
  d.categoryTreeVersion = CATEGORY_TREE_VERSION;
  return d;
}

function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    let d = JSON.parse(raw);
    if (!d || !Array.isArray(d.categories) || !Array.isArray(d.accounts)) return defaultData();
    d.transactions = d.transactions || [];
    d.budgets = d.budgets || {};
    d.recurring = d.recurring || [];
    d.holidays = (Array.isArray(d.holidays) ? d.holidays : []).filter(h => !krHolidaySetForYear(Number(h.slice(0, 4))).has(h));
    d.settings = d.settings || { usdKrwRate: null, rateUpdatedAt: null };
    d = migrateCategoriesToHierarchy(d);
    d = migrateAccountTypes(d);

    return d;
  } catch (e) { console.error(e); return defaultData(); }
}

}

/* ---------------- date helpers ---------------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function shiftMonth(mKey, delta) {
  const [y, m] = mKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function monthLabel(mKey) { const [y, m] = mKey.split('-').map(Number); return `${y}년 ${m}월`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function monthlyDayForMonth(r, y, m) { return r.day === 'last' ? daysInMonth(y, m) : Math.min(r.day || 1, daysInMonth(y, m)); }
function todayStr() { return ymd(new Date()); }
function isHolidayDate(d) {
  const wd = d.getDay();
  if (wd === 0 || wd === 6) return true;
  if (krHolidaySetForYear(d.getFullYear()).has(ymd(d))) return true;
  return (DATA.holidays || []).includes(ymd(d));
}
function nextBusinessDay(d) {
  const nd = new Date(d);
  while (isHolidayDate(nd)) nd.setDate(nd.getDate() + 1);
  return nd;
}
function prevBusinessDay(d) {
  const nd = new Date(d);
  while (isHolidayDate(nd)) nd.setDate(nd.getDate() - 1);
  return nd;
}
function isRecurringDueOn(r, d) {
  const freq = r.frequency || 'monthly';
  if (freq === 'daily') {
    return (r.dailyMode || 'weekdaysOnly') === 'everyday' || !isHolidayDate(d);
  }
  // Scan nearby calendar days for the un-shifted ("raw") occurrence and check whether its
  // holiday-shifted date lands on d — scanning (rather than reconstructing raw from d's own
  // week/month) keeps this correct even when a shift chain crosses a week/month boundary.
  const isRawDay = freq === 'weekly'
    ? (cand) => cand.getDay() === (r.weekday != null ? r.weekday : 1)
    : freq === 'yearly'
    ? (cand) => cand.getMonth() + 1 === (r.month || 1) && cand.getDate() === monthlyDayForMonth(r, cand.getFullYear(), r.month || 1)
    : (cand) => cand.getDate() === monthlyDayForMonth(r, cand.getFullYear(), cand.getMonth() + 1);
  for (let off = -8; off <= 8; off++) {
    const raw = _addDays(d, off);
    if (!isRawDay(raw)) continue;
    let eff = raw;
    if (r.type === 'expense' && !r.noHolidayShift) eff = nextBusinessDay(raw);
    else if (r.type === 'income' && r.payBeforeHoliday) eff = prevBusinessDay(raw);
    if (ymd(eff) === ymd(d)) return true;
  }
  return false;
}
function recurringAlreadyAppliedForPeriod(r, d) {
  const freq = r.frequency || 'monthly';
  if (freq === 'daily') {
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date === ymd(d));
  }
  if (freq === 'weekly') {
    const sun = ymd(_addDays(d, -d.getDay())), sat = ymd(_addDays(d, 6 - d.getDay()));
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date >= sun && t.date <= sat);
  }
  if (freq === 'yearly') {
    const y = String(d.getFullYear());
    return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date.slice(0, 4) === y);
  }
  const mKey = monthKey(d);
  return DATA.transactions.some(t => t.fromRecurringId === r.id && t.date.slice(0, 7) === mKey);
}

/* ---------------- formatting ---------------- */
function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function wonSigned(n) { const sign = n < 0 ? '-' : ''; return sign + Math.round(Math.abs(n)).toLocaleString('ko-KR') + '원'; }
function usdFmt(n) { return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function usdFmtSigned(n) { return (n < 0 ? '-' : '') + usdFmt(n); }
function fmtCurrency(n, currency) { return currency === 'USD' ? usdFmt(n) : won(n); }
function fmtCurrencySigned(n, currency) { return currency === 'USD' ? usdFmtSigned(n) : wonSigned(n); }
function usdToKrwRate() { return DATA.settings.usdKrwRate || DEFAULT_USD_KRW_RATE; }
function toKRW(amount, currency) { return currency === 'USD' ? amount * usdToKrwRate() : amount; }
function txAmountKRW(t) { return toKRW(t.amount, getAccount(t.accountId).currency || 'KRW'); }
async function fetchExchangeRate(silent) {

}
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getCategory(id) { return DATA.categories.find(c => c.id === id) || { name: '(삭제된 카테고리)', icon: '❔', colorIdx: 0 }; }
function getAccount(id) { return DATA.accounts.find(a => a.id === id) || { name: '(삭제된 자산)', icon: '❔' }; }
function catColor(cat) {
  if (cat.colorIdx != null) return CAT_COLORS[cat.colorIdx % 8];
  if (!cat.parentId && cat.type) {
    const idx = topCategories(cat.type).findIndex(p => p.id === cat.id);
    return CAT_COLORS[(idx >= 0 ? idx : 0) % 8];
  }
  return CAT_COLORS[0];
}
function topCategories(type) { return DATA.categories.filter(c => c.type === type && !c.parentId); }
function childCategories(parentId) { return DATA.categories.filter(c => c.parentId === parentId); }
function reorderCategory(id, newIndex) {
  const cat = DATA.categories.find(c => c.id === id);
  if (!cat) return;
  const oldSiblings = cat.parentId ? childCategories(cat.parentId) : topCategories(cat.type);
  const oldIndex = oldSiblings.findIndex(c => c.id === id);
  if (oldIndex === -1 || oldIndex === newIndex) return;
  DATA.categories.splice(DATA.categories.indexOf(cat), 1);
  const newSiblings = cat.parentId ? childCategories(cat.parentId) : topCategories(cat.type);
  const insertAt = newIndex >= newSiblings.length
    ? DATA.categories.indexOf(newSiblings[newSiblings.length - 1]) + 1
    : DATA.categories.indexOf(newSiblings[newIndex]);
  DATA.categories.splice(insertAt, 0, cat);
  saveData();
  renderSettings();
}
function leafCategories(type) { return DATA.categories.filter(c => c.type === type && c.parentId); }

/* ---------------- derived data ---------------- */
function accountBalance(acc, beforeDate) {
  let bal = Number(acc.initialBalance) || 0;
  DATA.transactions.forEach(t => {
    if (beforeDate && t.date >= beforeDate) return;
    if (t.type === 'income' && t.accountId === acc.id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) bal -= t.amount;
    else if (t.type === 'transfer') {
      if (t.accountId === acc.id) bal -= t.amount;
      if (t.toAccountId === acc.id) bal += t.amount;
    }
    if (t.type === 'expense' && t.linkedLoanAccountId === acc.id) bal += t.amount;
  });
  return bal;
}
function totalAssets() {
  return DATA.accounts.filter(a => a.includeInTotal !== false).reduce((s, a) => s + toKRW(accountBalance(a), a.currency || 'KRW'), 0);
}
function txInMonth(mKey) { return DATA.transactions.filter(t => t.date.slice(0, 7) === mKey); }
function monthSummary(mKey) {
  let income = 0, expense = 0;
  txInMonth(mKey).forEach(t => {
    if (t.excludeFromStats) return;
    if (t.type === 'income') income += txAmountKRW(t);
    else if (t.type === 'expense') expense += txAmountKRW(t);
  });
  return { income, expense, net: income - expense };
}
function categoryTotals(mKey, type) {
  const map = {};
  txInMonth(mKey).forEach(t => {
    if (t.type !== type || t.excludeFromStats) return;
    map[t.categoryId] = (map[t.categoryId] || 0) + txAmountKRW(t);
  });
  return Object.entries(map)
    .map(([categoryId, amount]) => ({ categoryId, amount, category: getCategory(categoryId) }))
    .sort((a, b) => b.amount - a.amount);
}
function txInPeriod(period, mKey) {
  if (period === 'all') return DATA.transactions;
  if (period === 'year') return DATA.transactions.filter(t => t.date.slice(0, 4) === mKey.slice(0, 4));
  return txInMonth(mKey);
}
function statsCategoryTotals(period, mKey, type, groupBy) {
  const map = {};
  txInPeriod(period, mKey).forEach(t => {
    if (t.type !== type || t.excludeFromStats) return;
    const leaf = getCategory(t.categoryId);
    const key = (groupBy === 'parent' && leaf.parentId) ? leaf.parentId : t.categoryId;
    map[key] = (map[key] || 0) + txAmountKRW(t);
  });
  return Object.entries(map)
    .map(([categoryId, amount]) => ({ categoryId, amount, category: getCategory(categoryId) }))
    .sort((a, b) => b.amount - a.amount);
}
function categoryUsageCount(catId) { return DATA.transactions.filter(t => t.categoryId === catId).length; }
function accountUsageCount(accId) { return DATA.transactions.filter(t => t.accountId === accId || t.toAccountId === accId || t.linkedLoanAccountId === accId).length; }

/* ---------------- custom date picker (single-tap select, no OS confirm step) ---------------- */
let dpState = null;
function openDatePicker(input) {
  if (dpState && dpState.input === input) { closeDatePicker(); return; }
  closeDatePicker();
  const pop = document.createElement('div');
  pop.className = 'dp-pop';
  document.body.appendChild(pop);
  dpState = { input, mKey: (input.value || todayStr()).slice(0, 7), pop };
  renderDatePicker();
  positionDatePicker();
  setTimeout(() => document.addEventListener('mousedown', onDatePickerOutsideClick), 0);
  window.addEventListener('resize', closeDatePicker);
  window.addEventListener('scroll', closeDatePicker, true);
}
function positionDatePicker() {
  if (!dpState) return;
  const rect = dpState.input.getBoundingClientRect();
  const top = Math.min(rect.bottom + 4, window.innerHeight - 300);
  const left = Math.min(rect.left, window.innerWidth - 262);
  dpState.pop.style.top = Math.max(8, top) + 'px';
  dpState.pop.style.left = Math.max(8, left) + 'px';
}
function renderDatePicker() {
  if (!dpState) return;
  const { input, mKey, pop } = dpState;
  const [y, m] = mKey.split('-').map(Number);
  const cells = buildCalendarCells(mKey);
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  const today = todayStr();
  pop.innerHTML = `
    <div class="dp-head">
      <button type="button" class="icon-btn" onclick="dpNav(-1)" aria-label="이전 달">&lt;</button>
      <div class="dp-label">${y}년 ${m}월</div>
      <button type="button" class="icon-btn" onclick="dpNav(1)" aria-label="다음 달">&gt;</button>
    </div>
    <div class="dp-grid">
      ${dows.map(d => `<div class="dp-dow">${d}</div>`).join('')}
      ${cells.map(date => {
        if (!date) return `<div class="dp-cell empty"></div>`;
        const d = Number(date.slice(-2));
        const cls = ['dp-cell'];
        if (date === today) cls.push('today');
        if (date === input.value) cls.push('sel');
        return `<div class="${cls.join(' ')}" onclick="dpPick('${date}')">${d}</div>`;
      }).join('')}
    </div>
    <div class="dp-foot"><button type="button" class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="dpPick('${today}')">오늘</button></div>
  `;
}
function dpNav(delta) {
  if (!dpState) return;
  dpState.mKey = shiftMonth(dpState.mKey, delta);
  renderDatePicker();
}
function dpPick(date) {
  if (!dpState) return;
  const input = dpState.input;
  input.value = date;
  input.dispatchEvent(new Event('change', { bubbles: true }));
  closeDatePicker();
}
function onDatePickerOutsideClick(e) {
  if (!dpState) return;
  if (dpState.pop.contains(e.target) || e.target === dpState.input) return;
  closeDatePicker();
}
function closeDatePicker() {
  if (!dpState) return;
  dpState.pop.remove();
  document.removeEventListener('mousedown', onDatePickerOutsideClick);
  window.removeEventListener('resize', closeDatePicker);
  window.removeEventListener('scroll', closeDatePicker, true);
  dpState = null;
}
document.addEventListener('click', (e) => {
  const target = e.target.closest('input[type="date"][readonly]');

});

function formatAmountInput(el) {

}
function rawAmount(el) { return Number(String(el.value).replace(/[^0-9]/g, '')) || 0; }
function formatSignedAmountInput(el) {
  const neg = el.value.trim().startsWith('-');
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = (neg ? '-' : '') + (digits ? Number(digits).toLocaleString('ko-KR') : '');

function rawSignedAmount(el) {
  const v = String(el.value);
  const neg = v.trim().startsWith('-');
  const n = Number(v.replace(/[^0-9]/g, '')) || 0;
  return neg ? -n : n;
}
function formatCurrencyAmountInput(el, currency, allowNegative) {
  if (currency !== 'USD') { if (allowNegative) formatSignedAmountInput(el); else formatAmountInput(el); return; }
  const neg = allowNegative && el.value.trim().startsWith('-');
  let v = el.value.replace(/[^0-9.]/g, '');
  const firstDot = v.indexOf('.');
  if (firstDot !== -1) v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
  const [intPartRaw, decPartRaw] = v.split('.');
  const intPart = (intPartRaw || '').replace(/^0+(?=\d)/, '');
  const intFormatted = intPart ? Number(intPart).toLocaleString('en-US') : '';
  const hasDot = v.includes('.');
  el.value = (neg ? '-' : '') + intFormatted + (hasDot ? '.' + (decPartRaw || '').slice(0, 2) : '');
}
function rawCurrencyAmount(el, currency, allowNegative) {
  if (currency !== 'USD') return allowNegative ? rawSignedAmount(el) : rawAmount(el);
  const v = String(el.value);
  const neg = allowNegative && v.trim().startsWith('-');
  const n = Number(v.replace(/[^0-9.]/g, '')) || 0;
  return neg ? -n : n;
}

/* ---------------- tabs / render root ---------------- */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  document.getElementById('kpi-row').style.display = tab === 'home' ? '' : 'none';
  renderPanel();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (btn) switchTab(btn.dataset.tab);
});

    <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="${onToday}">오늘</button>
  </div>`;
}
function navMonth(delta) {
  state.month = shiftMonth(state.month, delta);
  renderPanel();
}
function navToMonth(value) {
  if (!value) return;
  state.month = value;
  renderPanel();
}
function jumpToday() {
  state.month = monthKey(new Date());
  state.calSelected = todayStr();
  renderPanel();
}
function yearNavHtml(mKey) {
  const year = mKey.slice(0, 4);
  return `<div class="month-nav">
    <button class="icon-btn" onclick="navYear(-1)" aria-label="이전 해">&lt;</button>
    <div class="m-label">${year}년</div>

    <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="jumpToday()">올해</button>
  </div>`;
}
function navYear(delta) {
  const [y, m] = state.month.split('-');
  state.month = (Number(y) + delta) + '-' + m;
  renderPanel();
}

/* ---------------- CALENDAR ---------------- */
function buildCalendarCells(mKey) {
  const [y, m] = mKey.split('-').map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const startOffset = firstDay.getDay();
  const total = daysInMonth(y, m);
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(`${mKey}-${pad2(d)}`);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function renderCalendar() {
  const mKey = state.month;
  const cells = buildCalendarCells(mKey);
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  const today = todayStr();

  const dayTotals = {};
  txInMonth(mKey).forEach(t => {
    if (t.type === 'transfer') return;
    if (!dayTotals[t.date]) dayTotals[t.date] = { income: 0, expense: 0 };
    dayTotals[t.date][t.type] += txAmountKRW(t);
  });

  const gridHtml = `<div class="cal-grid">
    ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(date => {
      if (!date) return `<div class="cal-cell empty-cell"></div>`;
      const d = Number(date.slice(-2));
      const totals = dayTotals[date];
      const cls = ['cal-cell'];
      if (date === today) cls.push('today');
      if (date === state.calSelected) cls.push('selected');
      return `<div class="${cls.join(' ')}" onclick="selectCalDate('${date}')">
        <div class="date-num">${d}</div>
        ${totals && totals.income ? `<div class="cal-amt inc">+${abbrevWon(totals.income)}</div>` : ''}
        ${totals && totals.expense ? `<div class="cal-amt exp">-${abbrevWon(totals.expense)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;

  const dayTx = DATA.transactions.filter(t => t.date === state.calSelected).sort((a, b) => a.id.localeCompare(b.id));
  const dayLabel = state.calSelected.replace(/^\d+-0?/, '').replace('-', '월 ') + '일';

  document.getElementById('panel-calendar').innerHTML = `
    <div class="cal-layout">
      <div class="cal-main">
        ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}
        ${gridHtml}
      </div>
      <div class="day-list-card">
        <div class="section-heading" style="border-bottom:none;margin-bottom:8px;padding-bottom:0;">
          ${escapeHtml(dayLabel)} 내역
          <button class="ghost-btn" onclick="openTxModal(null, '${state.calSelected}')"><i class="ti ti-plus"></i> 이 날짜에 추가</button>
        </div>
        ${dayTx.length ? renderTxTable(dayTx, true) : `<div class="empty">이 날짜에 등록된 거래가 없어요.</div>`}
      </div>
    </div>
  `;
}
function selectCalDate(date) {
  state.calSelected = date;
  renderCalendar();
  openTxModal(null, date);
}
function abbrevWon(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '만';
  return n.toLocaleString('ko-KR');
}

/* ---------------- TRANSACTIONS ---------------- */

    </tr></thead>

      ${list.map(t => {
        const acc = getAccount(t.accountId);
        let mid;
        if (t.type === 'transfer') {
          const toAcc = getAccount(t.toAccountId);
          mid = `${acc.icon} ${escapeHtml(acc.name)} → ${toAcc.icon} ${escapeHtml(toAcc.name)}`;
        } else {
          const cat = getCategory(t.categoryId);
          mid = `${cat.icon} ${escapeHtml(cat.name)} <span style="color:var(--ink-faint)">· ${escapeHtml(acc.name)}</span>`;
        }
        const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
        const subParts = [];
        if (t.payee) subParts.push(`<span style="font-weight:600;">${escapeHtml(t.payee)}</span>`);

        const subLine = subParts.length || t.receipt
          ? `<div class="name-cell" style="font-size:11px;color:var(--ink-faint);margin-top:2px;">${subParts.join(' · ')}${t.receipt ? ' 🧾' : ''}</div>`
          : '';
        return `<tr>
          ${hideDate ? '' : `<td>${t.date.slice(5)}</td>`}
          <td>
            <div class="name-cell"><span class="type-tag ${t.type}">${t.type === 'income' ? '수입' : t.type === 'expense' ? '지출' : '이체'}</span> ${mid}</div>
            ${subLine}
          </td>
          <td class="num amt ${t.type}">${sign}${fmtCurrency(t.amount, acc.currency || 'KRW')}</td>
          <td class="actions-cell">
            ${t.receipt ? `<button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="openReceiptLightboxForTx('${t.id}')">사진</button>` : ''}
            <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="duplicateTx('${t.id}')" title="이 거래를 복사해서 새로 등록">복사</button>
            <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="openTxModal('${t.id}')">수정</button>
            <button class="ghost-btn danger-btn" style="font-size:12px;padding:5px 10px;" onclick="deleteTx('${t.id}')">삭제</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;

function renderTransactions() {
  const mKey = state.month;
  const f = state.txFilter;
  let list = txInMonth(mKey);
  if (f.type !== 'all') list = list.filter(t => t.type === f.type);
  if (f.categoryId) list = list.filter(t => t.categoryId === f.categoryId);
  if (f.accountId) list = list.filter(t => t.accountId === f.accountId || t.toAccountId === f.accountId);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => (t.memo || '').toLowerCase().includes(q) || (t.payee || '').toLowerCase().includes(q)); }
  list = list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

  const catTypesForFilter = f.type === 'all' ? ['expense', 'income'] : (f.type === 'transfer' ? [] : [f.type]);
  const catOptions = catTypesForFilter.map(type => {
    const groups = topCategories(type).map(p => {
      const children = childCategories(p.id);
      if (!children.length) return '';
      return `<optgroup label="${escapeHtml(p.icon + ' ' + p.name)}">${children.map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</optgroup>`;
    }).join('');
    return groups;
  }).join('');

  document.getElementById('panel-transactions').innerHTML = `
    ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}
    <div class="toolbar">
      <div class="btn-group">
        <select id="f-type" style="width:100px;" onchange="onFilterChange()">
          <option value="all" ${f.type === 'all' ? 'selected' : ''}>전체</option>
          <option value="expense" ${f.type === 'expense' ? 'selected' : ''}>지출</option>
          <option value="income" ${f.type === 'income' ? 'selected' : ''}>수입</option>
          <option value="transfer" ${f.type === 'transfer' ? 'selected' : ''}>이체</option>
        </select>
        <select id="f-category" style="width:150px;" onchange="onFilterChange()">
          <option value="">전체 카테고리</option>${catOptions}
        </select>
        <select id="f-account" style="width:130px;" onchange="onFilterChange()">
          <option value="">전체 자산</option>${DATA.accounts.map(a => `<option value="${a.id}" ${f.accountId === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}
        </select>
      </div>
      <div class="search-wrap">
        <input class="search-input" id="f-q" placeholder="대상/메모 검색" value="${escapeHtml(f.q)}" oninput="onFilterChange()">
      </div>
      <div class="btn-group">
        <button class="ghost-btn" onclick="openBulkImportModal()"><i class="ti ti-file-spreadsheet"></i> 일괄등록</button>
        <button class="primary-btn" onclick="openTxModal()"><i class="ti ti-plus"></i> 거래 추가</button>
      </div>
    </div>
    <div class="form-note">${monthLabel(mKey)} · ${list.length}건</div>
    ${list.length ? renderTxTable(list, false) : `<div class="empty"><div class="big">조건에 맞는 거래가 없어요</div>필터를 바꾸거나 새 거래를 추가해보세요.</div>`}
  `;
}
function onFilterChange() {
  state.txFilter.type = document.getElementById('f-type').value;
  state.txFilter.categoryId = document.getElementById('f-category').value;
  state.txFilter.accountId = document.getElementById('f-account').value;
  state.txFilter.q = document.getElementById('f-q').value;
  renderTransactions();
}

function duplicateTx(id) {
  const t = DATA.transactions.find(x => x.id === id);
  if (!t) return;
  openTxModal(null, todayStr(), null, t);
}
function addTxForAccount(accountId) {
  openTxModal(null, todayStr(), null, null, accountId);
}
function openTxModal(txId, presetDate, fromRecurring, duplicateFrom, presetAccountId) {

  const date = editing ? editing.date : (presetDate || todayStr());
  const editingCurrency = editing ? (getAccount(editing.accountId).currency || 'KRW')
    : (fromRecurring ? (getAccount(fromRecurring.accountId).currency || 'KRW')
      : (duplicateFrom ? (getAccount(duplicateFrom.accountId).currency || 'KRW') : 'KRW'));
  const editingAmountStr = editing
    ? (editingCurrency === 'USD' ? Number(editing.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Number(editing.amount).toLocaleString('ko-KR'))
    : (fromRecurring
      ? (editingCurrency === 'USD' ? Number(fromRecurring.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Number(fromRecurring.amount).toLocaleString('ko-KR'))
      : (duplicateFrom
        ? (editingCurrency === 'USD' ? Number(duplicateFrom.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Number(duplicateFrom.amount).toLocaleString('ko-KR'))

      <label class="field-lbl">날짜</label>
      <input type="date" id="tx-date" value="${date}" readonly>

        <button type="button" class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="document.getElementById('tx-date').value='${duplicateFrom.date}'">해당일 (${duplicateFrom.date.slice(5)})</button>

  renderTxModalFields(

    editing ? editing.accountId : (fromRecurring ? fromRecurring.accountId : (duplicateFrom ? duplicateFrom.accountId : (presetAccountId || null))),

function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1280; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function submitTx(editId) {

  const memo = document.getElementById('tx-memo').value.trim();

  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  let payload = { type, date, amount, memo, receipt: undefined, payee: undefined, vendor: undefined };
  if (type === 'transfer') {
    const accountId = document.getElementById('tx-account').value;
    const toAccountId = document.getElementById('tx-toaccount').value;
    if (!accountId || !toAccountId) return showToast('자산을 선택해주세요.', 'error');
    if (accountId === toAccountId) return showToast('출금 자산과 입금 자산이 같을 수 없어요.', 'error');
    if ((getAccount(accountId).currency || 'KRW') !== (getAccount(toAccountId).currency || 'KRW')) return showToast('통화가 다른 자산 간 이체는 아직 지원하지 않아요.', 'error');
    payload.accountId = accountId; payload.toAccountId = toAccountId;
  } else {
    const categoryId = document.getElementById('tx-category').value;
    const accountId = document.getElementById('tx-account').value;
    if (!categoryId) return showToast('카테고리가 없어요. 설정에서 먼저 추가해주세요.', 'error');
    if (!accountId) return showToast('자산이 없어요. 자산 탭에서 먼저 추가해주세요.', 'error');
    payload.categoryId = categoryId; payload.accountId = accountId;
    payload.excludeFromStats = document.getElementById('tx-exclude').checked;
    payload.receipt = type === 'expense' ? (state._txModal.receipt || null) : undefined;
    payload.vendor = type === 'expense' ? (document.getElementById('tx-vendor').value.trim() || null) : undefined;
    const loanEl = document.getElementById('tx-loan-account');
    const linkedLoanAccountId = type === 'expense' && loanEl ? (loanEl.value || null) : null;
    if (linkedLoanAccountId && (getAccount(linkedLoanAccountId).currency || 'KRW') !== (getAccount(accountId).currency || 'KRW')) {
      return showToast('대출/할부 계좌와 지출 자산의 통화가 달라 연결할 수 없어요.', 'error');
    }
    payload.linkedLoanAccountId = type === 'expense' ? linkedLoanAccountId : undefined;
  }
  payload.payee = document.getElementById('tx-payee').value.trim() || null;

  if (editId) {
    const idx = DATA.transactions.findIndex(t => t.id === editId);
    DATA.transactions[idx] = { ...DATA.transactions[idx], ...payload };
  } else {
    payload.id = uid();
    if (state._txModal.fromRecurringId) payload.fromRecurringId = state._txModal.fromRecurringId;
    DATA.transactions.push(payload);
  }
  saveData();
  closeModal();
  showToast(editId ? '거래를 수정했어요.' : (state._txModal.fromRecurringId ? '정기거래를 적용했어요.' : '거래를 추가했어요.'), 'success');
  renderAll();
}

function normalizeDateString(s) {
  if (s == null) return null;
  s = String(s).trim();
  if (!s) return null;
  const m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
  const n = Number(s);
  if (!isNaN(n) && n > 20000 && n < 90000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) return ymd(d);
  }
  return null;
}
function downloadBulkTemplate() {
  if (!window.XLSX) return showToast('엑셀 라이브러리를 불러오는 중이에요. 잠시 후 다시 시도해주세요.', 'error');

    ['2026-08-01', '수입', '급여', '현금', '', '회사', '', 3000000, '8월 급여'],
  ];
  const ws = XLSX.utils.aoa_to_sheet([BULK_HEADERS, ...sample]);
  ws['!cols'] = [{ wch: 15 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 18 }, { wch: 10 }, { wch: 22 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '거래내역');

  const expenseCats = leafCategories('expense').map(c => c.name);
  const incomeCats = leafCategories('income').map(c => c.name);
  const accts = DATA.accounts.map(a => a.name);
  const maxLen = Math.max(expenseCats.length, incomeCats.length, accts.length, 1);
  const refRows = [['지출 카테고리(소분류)', '수입 카테고리(소분류)', '자산']];
  for (let i = 0; i < maxLen; i++) refRows.push([expenseCats[i] || '', incomeCats[i] || '', accts[i] || '']);
  const wsRef = XLSX.utils.aoa_to_sheet(refRows);
  wsRef['!cols'] = [{ wch: 20 }, { wch: 20 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, wsRef, '참고(카테고리·자산)');

  XLSX.writeFile(wb, `가계부-일괄등록양식-${todayStr()}.xlsx`);

function parseBulkRow(row, idx) {
  const [dateRaw, typeRaw, catName, accName, toAccName, payeeRaw, vendorRaw, amountRaw, memoRaw] = row;
  const errors = [];
  const date = normalizeDateString(dateRaw);
  if (!date) errors.push('날짜 형식 오류');
  const type = BULK_TYPE_FROM_LABEL[String(typeRaw || '').trim()];
  if (!type) errors.push('구분은 지출/수입/이체 중 하나여야 해요');
  const amount = Math.round(Number(String(amountRaw || '').replace(/[^0-9.-]/g, '')));
  if (!amount || amount <= 0) errors.push('금액 오류');
  const memo = String(memoRaw || '').trim();
  let categoryId = null, accountId = null, toAccountId = null, payee = null, vendor = null;
  if (type === 'transfer') {
    const acc = DATA.accounts.find(a => a.name === String(accName || '').trim());
    const toAcc = DATA.accounts.find(a => a.name === String(toAccName || '').trim());
    if (!acc) errors.push(`출금 자산 없음: ${accName || '(비어있음)'}`);
    if (!toAcc) errors.push(`입금 자산 없음: ${toAccName || '(비어있음)'}`);
    else if (acc && toAcc.id === acc.id) errors.push('출금/입금 자산이 같아요');
    accountId = acc ? acc.id : null; toAccountId = toAcc ? toAcc.id : null;
  } else if (type) {
    const cat = DATA.categories.find(c => c.type === type && c.parentId && c.name === String(catName || '').trim());
    const acc = DATA.accounts.find(a => a.name === String(accName || '').trim());
    if (!cat) errors.push(`카테고리 없음: ${catName || '(비어있음)'}`);
    if (!acc) errors.push(`자산 없음: ${accName || '(비어있음)'}`);

    payee = String(payeeRaw || '').trim() || null;
    if (type === 'expense') vendor = String(vendorRaw || '').trim() || null;
  }
  return { idx, date, type, amount, categoryId, accountId, toAccountId, payee, vendor, memo, errors };

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function renderPieChart(totals, sum) {
  const cx = 150, cy = 150, r = 140;
  if (!sum) return '';
  if (totals.length === 1) {
    return `<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;display:block;margin:0 auto;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${catColor(totals[0].category)}"/>
      <text x="${cx}" y="${cy}" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">100%</text>
    </svg>`;
  }
  let cumulative = 0;
  const slices = totals.map(c => {
    const startAngle = cumulative / sum * 360;
    cumulative += c.amount;
    const endAngle = cumulative / sum * 360;
    return { ...c, startAngle, endAngle, pct: c.amount / sum };
  });
  const paths = slices.map(s => {
    const [x1, y1] = polarPoint(cx, cy, r, s.startAngle);
    const [x2, y2] = polarPoint(cx, cy, r, s.endAngle);
    const largeArc = s.endAngle - s.startAngle > 180 ? 1 : 0;
    return `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${catColor(s.category)}" stroke="#ffffff" stroke-width="2"/>`;
  }).join('');
  const labels = slices.filter(s => s.pct >= 0.06).map(s => {
    const mid = (s.startAngle + s.endAngle) / 2;
    const [lx, ly] = polarPoint(cx, cy, r * 0.66, mid);
    return `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">${Math.round(s.pct * 100)}%</text>`;
  }).join('');
  return `<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;display:block;margin:0 auto;">${paths}${labels}</svg>`;
}

/* ---------------- ACCOUNTS ---------------- */
function accountMonthFlow(acc, mKey, period) {
  let inflow = 0, outflow = 0;
  txInPeriod(period || 'month', mKey).forEach(t => {
    if (t.type === 'income' && t.accountId === acc.id) inflow += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) outflow += t.amount;
    else if (t.type === 'transfer') {
      if (t.toAccountId === acc.id) inflow += t.amount;
      if (t.accountId === acc.id) outflow += t.amount;
    }
    if (t.type === 'expense' && t.linkedLoanAccountId === acc.id) inflow += t.amount;
  });
  return { inflow, outflow, net: inflow - outflow };
}
function accountRunningBalances(acc) {
  const relevant = DATA.transactions.filter(t => t.accountId === acc.id || t.toAccountId === acc.id || t.linkedLoanAccountId === acc.id)
    .sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
  let bal = Number(acc.initialBalance) || 0;
  const map = {};
  relevant.forEach(t => {
    if (t.type === 'income' && t.accountId === acc.id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) bal -= t.amount;
    else if (t.type === 'transfer') {
      if (t.accountId === acc.id) bal -= t.amount;
      if (t.toAccountId === acc.id) bal += t.amount;
    }
    if (t.type === 'expense' && t.linkedLoanAccountId === acc.id) bal += t.amount;
    map[t.id] = bal;
  });
  return map;
}

    : period === 'year' ? accountBalance(acc, (Number(mKey.slice(0, 4)) + 1) + '-01-01')
    : accountBalance(acc, shiftMonth(mKey, 1) + '-01');
  const periodLabel = period === 'all' ? '전체 기간' : period === 'year' ? `${mKey.slice(0, 4)}년` : monthLabel(mKey);

  const list = txInPeriod(period, mKey)

      <div class="item"><div class="lbl">입금</div><div class="val income">${won(flow.inflow)}</div></div>

      <div class="item"><div class="lbl">합계</div><div class="val ${flow.net >= 0 ? 'income' : 'expense'}">${wonSigned(flow.net)}</div></div>

      <div class="section-heading">${periodLabel} 내역 (${list.length}건)<button class="ghost-btn" onclick="addTxForAccount('${acc.id}')"><i class="ti ti-plus"></i> 내역 추가</button></div>
      ${list.length ? renderAccountTxTable(list, acc) : `<div class="empty">해당 기간에는 거래가 없어요.</div>`}
    </div>
    <div class="form-actions" style="justify-content:flex-start;margin-top:14px;">
      <button class="ghost-btn danger-btn" onclick="deleteAccount('${acc.id}')">이 자산 삭제</button>

}
function renderAccounts() {
  const selected = state.acctSelectedId ? DATA.accounts.find(a => a.id === state.acctSelectedId) : null;
  const listRow = (a) => `<div class="acct-list-row ${a.includeInTotal === false ? 'excluded' : ''} ${selected && selected.id === a.id ? 'selected' : ''}" onclick="selectAccountDetail('${a.id}')">
    <span>${a.icon || ACC_TYPE_ICON[a.type] || '💰'} ${escapeHtml(a.name)}${a.currency === 'USD' ? ' <span class="ccy-badge usd">USD</span>' : ''}</span>
    <span class="acct-list-bal ${accountBalance(a) < 0 ? 'expense' : ''}">${fmtCurrencySigned(accountBalance(a), a.currency || 'KRW')}</span>
  </div>`;
  const groupBlock = (type) => {
    const accts = DATA.accounts.filter(a => a.type === type);
    if (!accts.length) return '';
    const hasUsd = accts.some(a => a.currency === 'USD');
    const subtotalKRW = accts.reduce((s, a) => s + toKRW(accountBalance(a), a.currency || 'KRW'), 0);
    return `<details class="acct-list-group" open>
      <summary class="acct-list-group-head">
        <span>${ACC_TYPE_ICON[type]} ${ACC_TYPE_LABEL[type]} <span class="form-note" style="margin:0;">${accts.length}</span></span>
        <span class="acct-group-toggle">${wonSigned(subtotalKRW)}${hasUsd ? ' (환산)' : ''} <button class="icon-btn" style="margin-left:4px;" onclick="event.stopPropagation();openAccountModal(null, '${type}')" title="자산 추가" aria-label="자산 추가">+</button></span>
      </summary>
      ${accts.map(listRow).join('')}
    </details>`;
  };
  const rate = DATA.settings.usdKrwRate;
  const rateLine = rate
    ? `1 USD = ${won(rate)} <span style="color:var(--ink-faint);">(${new Date(DATA.settings.rateUpdatedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 기준)</span>`
    : `환율 정보 없음 (기본값 1 USD = ${won(DEFAULT_USD_KRW_RATE)} 사용 중)`;
  document.getElementById('panel-accounts').innerHTML = `
    <div class="toolbar">
      <div class="hint">${DATA.accounts.length}개 자산 · 총 자산 ${won(totalAssets())}</div>
      <button class="primary-btn" onclick="openAccountModal()"><i class="ti ti-plus"></i> 자산 추가</button>
    </div>
    <div class="form-note" style="display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
      ${rateLine}
      <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="fetchExchangeRate(false)">환율 새로고침</button>
    </div>
    <div class="acct-master-detail">
      <div class="acct-list-pane ${selected ? 'has-selection' : ''}">
        <div class="acct-list-group">
          <div class="acct-list-group-head"><span>전체 <span class="form-note" style="margin:0;">${DATA.accounts.length}</span></span><span>${wonSigned(totalAssets())}</span></div>
        </div>
        ${ACC_TYPES.map(groupBlock).join('')}
      </div>
      <div class="acct-detail-pane ${selected ? 'active' : ''}">
        ${selected ? renderAccountDetail(selected) : `<div class="empty">왼쪽에서 자산을 선택하면 상세 내역을 볼 수 있어요.</div>`}
      </div>
    </div>
  `;
}
function balanceFieldInnerHtml(type, currency, amountAbs, manualNegative) {
  const val = currency === 'USD'
    ? (amountAbs ? amountAbs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '')
    : (amountAbs ? amountAbs.toLocaleString('ko-KR') : '');
  if (LIABILITY_TYPES.includes(type)) {
    return `<label class="field-lbl">갚아야 할 금액</label><input type="text" inputmode="decimal" id="acc-balance" oninput="formatCurrencyAmountInput(this, '${currency}')" value="${val}" placeholder="0">
      <div class="form-note" style="margin-top:6px;">입력한 금액만큼 자동으로 마이너스(빚)로 계산돼요.</div>`;
  }
  return `<label class="field-lbl">초기 잔액</label><input type="text" inputmode="decimal" id="acc-balance" oninput="formatCurrencyAmountInput(this, '${currency}', true)" value="${(manualNegative ? '-' : '') + (val || (currency === 'USD' ? '0.00' : '0'))}">
    <div class="form-note" style="margin-top:6px;">마이너스 통장처럼 잔액이 마이너스면 -로 입력해주세요.</div>`;
}
function onAccTypeChangeInModal() {
  const type = document.getElementById('acc-type').value;
  const currency = document.getElementById('acc-currency').value;
  const cur = document.getElementById('acc-balance');
  const amountAbs = cur ? Math.abs(rawCurrencyAmount(cur, currency, true)) : 0;
  document.getElementById('acc-balance-field').innerHTML = balanceFieldInnerHtml(type, currency, amountAbs, false);
  renderAccDateRangeField(type);
}
function renderAccDateRangeField(type, startDate, endDate) {

  if (!el) return;
  el.innerHTML = DATE_RANGE_TYPES.includes(type)
    ? `<div class="form-grid">
        <div><label class="field-lbl">시작일</label><input type="date" id="acc-start-date" value="${startDate || ''}" readonly></div>

function openAccountModal(id, presetType) {
  const editing = id ? DATA.accounts.find(a => a.id === id) : null;
  const type = editing ? editing.type : (presetType || 'cash');
  const currency = editing ? (editing.currency || 'KRW') : 'KRW';

  const lockCurrency = editing && accountUsageCount(editing.id) > 0;
  openModal(`

    <div class="field"><label class="field-lbl">이름</label><input type="text" id="acc-name" value="${escapeHtml(editing ? editing.name : '')}" placeholder="예: 신한은행, 국민카드"></div>
    <div class="form-grid">
      <div><label class="field-lbl">분류</label><select id="acc-type" onchange="onAccTypeChangeInModal()">
        ${ACC_TYPES.map(t => `<option value="${t}" ${type === t ? 'selected' : ''}>${ACC_TYPE_ICON[t]} ${ACC_TYPE_LABEL[t]}</option>`).join('')}
      </select></div>
      <div><label class="field-lbl">통화</label><select id="acc-currency" onchange="onAccTypeChangeInModal()" ${lockCurrency ? 'disabled' : ''}>
        ${CURRENCIES.map(c => `<option value="${c}" ${currency === c ? 'selected' : ''}>${CURRENCY_LABEL[c]}</option>`).join('')}
      </select></div>
    </div>
    ${lockCurrency ? '<div class="form-note" style="margin-top:-6px;">이미 거래가 있는 자산은 통화를 바꿀 수 없어요.</div>' : ''}
    <div class="field" id="acc-balance-field">${balanceFieldInnerHtml(type, currency, editingAbs, editingNeg)}</div>
    <div class="field" id="acc-daterange-field"></div>
    <div class="field"><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);"><input type="checkbox" id="acc-include" style="width:15px;height:15px;" ${!editing || editing.includeInTotal !== false ? 'checked' : ''}> 총 자산 합계에 포함</label></div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitAccount(${editing ? `'${editing.id}'` : 'null'})">${editing ? '저장' : '추가'}</button>
    </div>
  `);
  renderAccDateRangeField(type, editing ? editing.startDate : null, editing ? editing.endDate : null);
}
function submitAccount(editId) {
  const name = document.getElementById('acc-name').value.trim();
  const type = document.getElementById('acc-type').value;
  const currency = document.getElementById('acc-currency').value;
  const balanceEl = document.getElementById('acc-balance');
  const initialBalance = LIABILITY_TYPES.includes(type) ? -rawCurrencyAmount(balanceEl, currency) : rawCurrencyAmount(balanceEl, currency, true);
  const includeInTotal = document.getElementById('acc-include').checked;
  const startDate = DATE_RANGE_TYPES.includes(type) ? (document.getElementById('acc-start-date').value || null) : null;
  const endDate = DATE_RANGE_TYPES.includes(type) ? (document.getElementById('acc-end-date').value || null) : null;
  if (!name) return showToast('자산 이름을 입력해주세요.', 'error');
  if (editId) {
    const acc = DATA.accounts.find(a => a.id === editId);
    Object.assign(acc, { name, type, currency, initialBalance, includeInTotal, icon: ACC_TYPE_ICON[type], startDate, endDate });
  } else {
    DATA.accounts.push({ id: uid(), name, type, currency, initialBalance, includeInTotal, icon: ACC_TYPE_ICON[type], startDate, endDate });
  }
  saveData();
  closeModal();
  showToast(editId ? '자산을 수정했어요.' : '자산을 추가했어요.', 'success');
  renderAll();
}
function deleteAccount(id) {
  const used = accountUsageCount(id);
  if (used > 0) return showToast(`이 자산을 사용하는 거래가 ${used}건 있어 삭제할 수 없어요.`, 'error');
  if (DATA.accounts.length <= 1) return showToast('최소 1개의 자산은 있어야 해요.', 'error');
  if (!confirm('이 자산을 삭제할까요?')) return;
  DATA.accounts = DATA.accounts.filter(a => a.id !== id);
  if (state.acctSelectedId === id) state.acctSelectedId = null;
  saveData();
  showToast('삭제했어요.', 'info');
  renderAll();
}

/* ---------------- RECURRING ---------------- */
function recFieldLabels(type) {
  if (type === 'income') return { name: '수입명', day: '수입주기' };
  if (type === 'transfer') return { name: '이체명', day: '이체주기' };
  return { name: '지출명', day: '지출주기' };
}
function recurringScheduleLabel(r) {
  const freq = r.frequency || 'monthly';
  if (freq === 'weekly') return `매주 ${['일', '월', '화', '수', '목', '금', '토'][r.weekday != null ? r.weekday : 1]}요일`;
  if (freq === 'daily') return (r.dailyMode || 'weekdaysOnly') === 'everyday' ? '매일 (휴일포함)' : '매일 (평일만)';
  if (freq === 'yearly') return r.day === 'last' ? `매년 ${r.month}월 말일` : `매년 ${r.month}월 ${r.day}일`;
  return r.day === 'last' ? '매월 말일' : `매월 ${r.day}일`;
}

          const subParts = [mid];

function submitRecurring(editId) {
  const type = state._recModal.type;
  const freq = state._recModal.freq;
  const name = document.getElementById('rec-name').value.trim();
  const amount = rawCurrencyAmount(document.getElementById('rec-amount'), currentRecCurrency());
  if (!name) return showToast('이름을 입력해주세요.', 'error');
  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  const holidayAdjustChecked = document.getElementById('rec-holiday-adjust').checked;
  let payload = {
    type, name, amount, frequency: freq,
    noHolidayShift: type === 'expense' && freq !== 'daily' && holidayAdjustChecked,
    payBeforeHoliday: type === 'income' && freq !== 'daily' && holidayAdjustChecked,
  };
  if (freq === 'weekly') {
    payload.weekday = Number(document.getElementById('rec-weekday').value);
  } else if (freq === 'daily') {
    payload.dailyMode = document.getElementById('rec-daily-mode').value === 'everyday' ? 'everyday' : 'weekdaysOnly';
  } else if (freq === 'yearly') {
    payload.month = Number(document.getElementById('rec-month').value);
    const yearlyDayRaw = document.getElementById('rec-day').value;
    payload.day = yearlyDayRaw === 'last' ? 'last' : Math.min(31, Math.max(1, Number(yearlyDayRaw) || 1));
  } else {
    const dayRaw = document.getElementById('rec-day').value;
    payload.day = dayRaw === 'last' ? 'last' : Math.min(31, Math.max(1, Number(dayRaw) || 1));
  }
  if (type === 'transfer') {
    payload.accountId = document.getElementById('rec-account').value;
    payload.toAccountId = document.getElementById('rec-toaccount').value;
    if (payload.accountId === payload.toAccountId) return showToast('출금/입금 자산이 같을 수 없어요.', 'error');
  } else {
    payload.categoryId = document.getElementById('rec-category').value;
    payload.accountId = document.getElementById('rec-account').value;
  }
  payload.payee = document.getElementById('rec-payee').value.trim() || null;
  if (editId) {
    const idx = DATA.recurring.findIndex(r => r.id === editId);
    DATA.recurring[idx] = { ...DATA.recurring[idx], ...payload };
  } else {
    payload.id = uid();
    DATA.recurring.push(payload);
  }
  saveData();
  closeModal();
  showToast(editId ? '정기거래를 수정했어요.' : '정기거래를 추가했어요.', 'success');
  renderAll();
}
