/* ---------------- RECURRING ---------------- */
function recFieldLabels(type) {
  if (type === 'income') return { name: '수입명', day: '수입주기' };
  if (type === 'transfer') return { name: '이체명', day: '이체주기' };
  return { name: '지출명', day: '지출주기' };
}
function recurringScheduleLabel(r) {
  const freq = r.frequency || 'monthly';
  if (freq === 'weekly') return `매주 ${['일', '월', '화', '수', '목', '금', '토'][r.weekday != null ? r.weekday : 1]}요일`;
  if (freq === 'daily') return (r.dailyMode || 'weekdaysOnly') === 'everyday' ? '매일 (휴일포함)' : '매일 (평일만)';
  if (freq === 'yearly') return r.day === 'last' ? `매년 ${r.month}월 말일` : `매년 ${r.month}월 ${r.day}일`;
  return r.day === 'last' ? '매월 말일' : `매월 ${r.day}일`;
}
const REC_TYPE_ORDER = ['income', 'expense', 'transfer'];
const REC_TYPE_LABEL = { income: '수입', expense: '지출', transfer: '이체' };
const REC_FREQ_ORDER = { daily: 0, weekly: 1, monthly: 2, yearly: 3 };
function recurringDayNum(d) { return d === 'last' ? 32 : (Number(d) || 1); }
function recurringSortKey(r) {
  const freq = r.frequency || 'monthly';
  const freqRank = REC_FREQ_ORDER[freq] ?? 2;
  if (freq === 'weekly') return [freqRank, r.weekday != null ? r.weekday : 1, 0];
  if (freq === 'yearly') return [freqRank, r.month || 1, recurringDayNum(r.day)];
  if (freq === 'monthly') return [freqRank, recurringDayNum(r.day), 0];
  return [freqRank, 0, 0];
}
function compareRecurringSortKey(a, b) {
  const ka = recurringSortKey(a), kb = recurringSortKey(b);
  for (let i = 0; i < ka.length; i++) { if (ka[i] !== kb[i]) return ka[i] - kb[i]; }
  return a.name.localeCompare(b.name, 'ko');
}
function recSortKeyValue(r, key) {
  switch (key) {
    case 'type': return REC_TYPE_LABEL[r.type] || '';
    case 'account': return (getAccount(r.accountId) || {}).name || '';
    case 'catParent': { const v = categoryParentCellText(r.categoryId); return v === '-' ? '' : v; }
    case 'catChild': { const v = categoryChildCellText(r.categoryId); return v === '-' ? '' : v; }
    case 'name': return r.name || '';
    case 'payee': return r.payee || '';
    case 'vendor': return r.vendor || '';
    case 'amount': return r.amount;
    default: return '';
  }
}
function compareRecByKey(a, b, key) {
  if (key === 'freq') return compareRecurringSortKey(a, b);
  return compareSortValues(recSortKeyValue(a, key), recSortKeyValue(b, key));
}
function sortRecList(items, sortState) {
  if (!sortState) return items;
  const { key, dir } = sortState;
  return items.slice().sort((a, b) => {
    const cmp = compareRecByKey(a, b, key);
    return dir === 'asc' ? cmp : -cmp;
  });
}
function setRecSort(key) {
  state._recSort = toggleSortState(state._recSort, key);
  renderRecurring();
}
function recSearchText(r) {
  const acc = getAccount(r.accountId);
  const typeLabel = REC_TYPE_LABEL[r.type] || '';
  const parts = [r.name || '', typeLabel, acc ? acc.name : '', r.payee || '', r.vendor || '', String(r.amount), recurringScheduleLabel(r)];

function submitRecurring(editId) {
  const type = state._recModal.type;
  const freq = state._recModal.freq;
  const name = document.getElementById('rec-name').value.trim();
  const amount = rawCurrencyAmount(document.getElementById('rec-amount'), currentRecCurrency());
  if (!name) return showToast('이름을 입력해주세요.', 'error');
  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  const holidayAdjustChecked = document.getElementById('rec-holiday-adjust').checked;
  let payload = {
    type, name, amount, frequency: freq,
    noHolidayShift: type === 'expense' && freq !== 'daily' && holidayAdjustChecked,
    payBeforeHoliday: type === 'income' && freq !== 'daily' && holidayAdjustChecked,
  };
  if (freq === 'weekly') {
    payload.weekday = Number(document.getElementById('rec-weekday').value);
  } else if (freq === 'daily') {
    payload.dailyMode = document.getElementById('rec-daily-mode').value === 'everyday' ? 'everyday' : 'weekdaysOnly';
  } else if (freq === 'yearly') {
    payload.month = Number(document.getElementById('rec-month').value);
    const yearlyDayRaw = document.getElementById('rec-day').value;
    payload.day = yearlyDayRaw === 'last' ? 'last' : Math.min(31, Math.max(1, Number(yearlyDayRaw) || 1));
  } else {
    const dayRaw = document.getElementById('rec-day').value;
    payload.day = dayRaw === 'last' ? 'last' : Math.min(31, Math.max(1, Number(dayRaw) || 1));
  }
  if (type === 'transfer') {
    payload.categoryId = document.getElementById('rec-category').value;
    payload.accountId = document.getElementById('rec-account').value;
    payload.toAccountId = document.getElementById('rec-toaccount').value;
    if (!payload.categoryId) return showToast('카테고리가 없어요. 설정에서 먼저 추가해주세요.', 'error');
    if (payload.accountId === payload.toAccountId) return showToast('출금/입금 자산이 같을 수 없어요.', 'error');
  } else {
    payload.categoryId = document.getElementById('rec-category').value;
    payload.accountId = document.getElementById('rec-account').value;
  }
  payload.payee = document.getElementById('rec-payee').value.trim() || null;
  payload.vendor = document.getElementById('rec-vendor').value.trim() || null;
  registerPayeeIfNew(payload.payee);
  registerVendorIfNew(payload.vendor);
  if (editId) {
    const idx = DATA.recurring.findIndex(r => r.id === editId);
    DATA.recurring[idx] = { ...DATA.recurring[idx], ...payload };
  } else {
    payload.id = uid();
    DATA.recurring.push(payload);
  }
  saveData();
  closeRecPanel();
  showToast(editId ? '정기거래를 수정했어요.' : '정기거래를 추가했어요.', 'success');
  renderAll();
}

  DATA.recurring = DATA.recurring.filter(r => r.id !== id);

function notifyDueRecurringToday() {
  const due = todaysRecurring().filter(r => !r.alreadyApplied);
  if (!due.length) return;
  const key = 'hl_recurring_notified_' + todayStr();
  if (localStorage.getItem(key)) return;
  localStorage.setItem(key, '1');
  const summary = due.map(r => r.name).join(', ');
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {

  }
  showToast(`오늘 정기거래 ${due.length}건이 있어요: ${summary}`, 'info');
}

let catDrag = null;
function startCatDrag(ev, id) {
  ev.preventDefault();
  if (catDrag) return;
  const row = ev.currentTarget.closest('.cat-parent-group, .cat-chip');
  if (!row) return;
  const list = row.parentElement;
  const cls = row.classList.contains('cat-parent-group') ? 'cat-parent-group' : 'cat-chip';
  const rect = row.getBoundingClientRect();
  const placeholder = document.createElement('div');
  placeholder.className = cls + ' cat-drag-placeholder';
  placeholder.style.height = rect.height + 'px';
  list.insertBefore(placeholder, row);
  row.classList.add('cat-dragging');
  row.style.position = 'fixed';
  row.style.width = rect.width + 'px';
  row.style.left = rect.left + 'px';
  row.style.top = rect.top + 'px';
  document.body.appendChild(row);
  catDrag = { id, row, list, cls, placeholder, startClientY: ev.clientY, startTop: rect.top };
  document.addEventListener('pointermove', onCatDragMove);
  document.addEventListener('pointerup', onCatDragEnd);
}
function onCatDragMove(ev) {
  if (!catDrag) return;
  ev.preventDefault();
  const dy = ev.clientY - catDrag.startClientY;
  catDrag.row.style.top = (catDrag.startTop + dy) + 'px';
  const rowRect = catDrag.row.getBoundingClientRect();
  const rowCenter = rowRect.top + rowRect.height / 2;
  const siblings = Array.from(catDrag.list.children).filter(el => el.classList.contains(catDrag.cls) || el === catDrag.placeholder);
  const phIndex = siblings.indexOf(catDrag.placeholder);
  for (let i = 0; i < siblings.length; i++) {
    const sib = siblings[i];
    if (sib === catDrag.placeholder) continue;
    const r = sib.getBoundingClientRect();
    const sibCenter = r.top + r.height / 2;
    if (i < phIndex && rowCenter < sibCenter) { catDrag.list.insertBefore(catDrag.placeholder, sib); break; }
    if (i > phIndex && rowCenter > sibCenter) { catDrag.list.insertBefore(catDrag.placeholder, sib.nextSibling); break; }
  }
}
function onCatDragEnd() {
  if (!catDrag) return;
  document.removeEventListener('pointermove', onCatDragMove);
  document.removeEventListener('pointerup', onCatDragEnd);
  const { id, row, list, cls, placeholder } = catDrag;
  const finalSiblings = Array.from(list.children).filter(el => el.classList.contains(cls) || el === placeholder);
  const newIndex = finalSiblings.indexOf(placeholder);
  list.replaceChild(row, placeholder);
  row.classList.remove('cat-dragging');
  row.style.position = ''; row.style.width = ''; row.style.left = ''; row.style.top = '';
  catDrag = null;
  reorderCategory(id, newIndex);
}

  if (Notification.permission === 'denied') return '알림 차단됨 (브라우저 설정에서 허용 필요)';
  return '알림 켜기';
}
function requestNotifyPermission() {
  if (typeof Notification === 'undefined') return showToast('이 브라우저는 알림을 지원하지 않아요.', 'error');

    renderSettings();

      <div class="emoji-pick" id="emoji-pick">
        <button type="button" class="${icon === '' ? 'active' : ''}" onclick="pickEmoji('', this)" style="width:auto;padding:0 8px;font-size:11px;white-space:nowrap;">없음</button>
        ${EMOJI_CHOICES.map(e => `<button type="button" class="${e === icon ? 'active' : ''}" onclick="pickEmoji('${e}', this)">${e}</button>`).join('')}
      </div>
      <input type="text" id="cat-icon" value="${escapeHtml(icon)}" maxlength="4" style="width:70px;">
    </div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitParentCategory(${editing ? `'${editing.id}'` : 'null'})">${editing ? '저장' : '추가'}</button>
    </div>
  `);
  state._catModal = { type };
}
function setCatType(t) {
  state._catModal.type = t;
  document.querySelectorAll('#cat-type-seg button').forEach(b => {
    const active = b.dataset.v === t;
    b.classList.toggle('active', active);
    b.classList.toggle('expense-active', active && t === 'expense');
    b.classList.toggle('income-active', active && t === 'income');
  });
}
function pickEmoji(e, btn) {
  document.getElementById('cat-icon').value = e;
  document.querySelectorAll('#emoji-pick button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function submitParentCategory(editId) {
  const name = document.getElementById('cat-name').value.trim();
  const icon = document.getElementById('cat-icon').value.trim();
  if (!name) return showToast('대분류 이름을 입력해주세요.', 'error');
  if (editId) {
    const cat = DATA.categories.find(c => c.id === editId);
    Object.assign(cat, { name, icon });
  } else {
    DATA.categories.push({ id: uid(), type: state._catModal.type, name, icon, parentId: null });
  }
  saveData();
  closeModal();
  showToast(editId ? '대분류를 수정했어요.' : '대분류를 추가했어요.', 'success');
  renderSettings();
}
function openChildCategoryModal(id, presetParentId) {
  const editing = id ? DATA.categories.find(c => c.id === id) : null;
  const parent = editing ? DATA.categories.find(c => c.id === editing.parentId) : DATA.categories.find(c => c.id === presetParentId);
  if (!parent) return showToast('먼저 대분류를 선택해주세요.', 'error');
  const type = parent.type;
  const icon = editing ? editing.icon : '📦';
  const parents = topCategories(type);
  openModal(`
    <h3>${editing ? '소분류 수정' : '소분류 추가'}</h3>
    <div class="field"><label class="field-lbl">대분류</label><select id="cat-parent">${parents.map(p => `<option value="${p.id}" ${p.id === parent.id ? 'selected' : ''}>${p.icon} ${escapeHtml(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label class="field-lbl">소분류 이름</label><input type="text" id="cat-name" value="${escapeHtml(editing ? editing.name : '')}" placeholder="예: 카페/간식"></div>
    <div class="field"><label class="field-lbl">아이콘</label>
      <div class="emoji-pick" id="emoji-pick">
        <button type="button" class="${icon === '' ? 'active' : ''}" onclick="pickEmoji('', this)" style="width:auto;padding:0 8px;font-size:11px;white-space:nowrap;">없음</button>
        ${EMOJI_CHOICES.map(e => `<button type="button" class="${e === icon ? 'active' : ''}" onclick="pickEmoji('${e}', this)">${e}</button>`).join('')}
      </div>
      <input type="text" id="cat-icon" value="${escapeHtml(icon)}" maxlength="4" style="width:70px;">
    </div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitChildCategory(${editing ? `'${editing.id}'` : 'null'}, '${type}')">${editing ? '저장' : '추가'}</button>
    </div>
  `);
}
function submitChildCategory(editId, type) {
  const name = document.getElementById('cat-name').value.trim();
  const icon = document.getElementById('cat-icon').value.trim();
  const parentId = document.getElementById('cat-parent').value;
  if (!name) return showToast('소분류 이름을 입력해주세요.', 'error');
  if (editId) {
    const cat = DATA.categories.find(c => c.id === editId);
    Object.assign(cat, { name, icon, parentId });
  } else {
    const colorIdx = leafCategories(type).length % 8;
    DATA.categories.push({ id: uid(), type, name, icon, parentId, colorIdx });
  }
  saveData();
  closeModal();
  showToast(editId ? '소분류를 수정했어요.' : '소분류를 추가했어요.', 'success');
  renderSettings();
}
function deleteCategory(id) {
  const cat = DATA.categories.find(c => c.id === id);
  if (!cat) return;
  if (!cat.parentId) {
    if (childCategories(id).length > 0) return showToast('먼저 이 대분류의 소분류를 모두 삭제해주세요.', 'error');
    if (!confirm(`'${cat.name}' 대분류를 삭제할까요?`)) return;
    DATA.categories = DATA.categories.filter(c => c.id !== id);
  } else {
    const used = categoryUsageCount(id);
    if (used > 0) return showToast(`이 카테고리를 사용하는 거래가 ${used}건 있어요. 옆의 ⇄ 버튼으로 다른 카테고리로 옮긴 뒤 삭제해주세요.`, 'error');
    if (!confirm('이 소분류를 삭제할까요?')) return;
    DATA.categories = DATA.categories.filter(c => c.id !== id);
    delete DATA.budgets[id];
  }
  saveData();
  showToast('삭제했어요.', 'info');
  renderSettings();
}
function openReassignCategoryModal(sourceId) {
  const source = DATA.categories.find(c => c.id === sourceId);
  if (!source) return;
  const used = categoryUsageCount(sourceId);
  const targets = leafCategories(source.type).filter(c => c.id !== sourceId);
  if (!targets.length) return showToast('옮겨갈 다른 소분류가 없어요. 먼저 소분류를 추가해주세요.', 'error');
  const groups = topCategories(source.type).map(p => {
    const children = childCategories(p.id).filter(c => c.id !== sourceId);
    if (!children.length) return '';
    return `<optgroup label="${escapeHtml(p.icon + ' ' + p.name)}">${children.map(c => `<option value="${c.id}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</optgroup>`;
  }).join('');
  openModal(`
    <h3>카테고리 일괄 변경</h3>
    <div class="form-note">'${source.icon} ${escapeHtml(source.name)}'${used ? `을(를) 사용하는 거래 ${used}건을` : '에는 아직 거래가 없어요. 그래도'} 아래에서 고르는 카테고리로 한 번에 옮겨요. 예산 설정은 옮겨지지 않으니 필요하면 새 카테고리에 다시 설정해주세요.</div>
    <div class="field"><label class="field-lbl">옮길 카테고리</label><select id="reassign-target">${groups}</select></div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitReassignCategory('${sourceId}')">일괄 변경</button>
    </div>
  `);
}
function submitReassignCategory(sourceId) {
  const targetId = document.getElementById('reassign-target').value;
  if (!targetId) return showToast('옮길 카테고리를 선택해주세요.', 'error');
  let count = 0;
  DATA.transactions.forEach(t => {
    if (t.categoryId === sourceId) { t.categoryId = targetId; count++; }
  });
  delete DATA.budgets[sourceId];
  saveData();
  closeModal();
  showToast(count ? `${count}건을 새 카테고리로 옮겼어요.` : '카테고리를 변경했어요.', 'success');
  renderAll();
}
function resetAllData() {
  if (!confirm('정말로 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.')) return;
  if (!confirm('한 번 더 확인할게요. 정말 전체 초기화하시겠어요?')) return;
  DATA = defaultData();
  saveData();
  showToast('초기화했어요.', 'info');
  renderAll();
}

/* ---------------- backup: export / import ---------------- */
async function exportBackup() {
  const receiptsById = {};
  for (const t of DATA.transactions) {
    for (const rid of (t.receiptIds || [])) {
      try { const d = await getReceipt(rid); if (d) receiptsById[rid] = d; } catch (e) { console.error('receipt export failed', rid, e); }
    }
  }
  const exportData = { ...DATA, receiptsById };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = todayStr();
  a.href = url; a.download = `가계부-백업-${today}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일을 내려받았어요.', 'success');
}
function triggerImportFile() { document.getElementById('file-import').click(); }
function onImportFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.categories) || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) throw new Error('invalid');
      if (!confirm('가져오기를 하면 현재 데이터를 덮어써요. 계속할까요?')) return;
      DATA = { version: 1, categorySchema: parsed.categorySchema, accounts: parsed.accounts, categories: parsed.categories, transactions: parsed.transactions, budgets: parsed.budgets || {}, periodBudgets: parsed.periodBudgets || [], recurring: parsed.recurring || [], payees: parsed.payees || [], vendors: parsed.vendors || [], insuranceClaims: parsed.insuranceClaims || [], insTargets: parsed.insTargets || [], insTypes: parsed.insTypes || [], insCompanies: parsed.insCompanies || [], insApplyTypes: parsed.insApplyTypes || [], insProgresses: parsed.insProgresses || [], settings: parsed.settings || { usdKrwRate: null, rateUpdatedAt: null } };
      DATA = migrateCategoriesToHierarchy(DATA);
      DATA = migrateAccountTypes(DATA);
      DATA = migratePayeeVendorRegistry(DATA);
      DATA = migrateSeedInsuranceTagLists(DATA);
      DATA = migrateSeedInsuranceExtraTagLists(DATA);
      if (parsed.receiptsById) {
        for (const [txId, dataUrl] of Object.entries(parsed.receiptsById)) {
          try { await putReceipt(txId, dataUrl); } catch (err) { console.error('receipt import failed', txId, err); }
        }
      }
      await migrateReceiptsToIndexedDB();
      saveData();
      showToast('데이터를 가져왔어요.', 'success');
      renderAll();
    } catch (err) {
      showToast('올바른 백업 파일이 아니에요.', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- init ---------------- */
async function startApp(email) {
  currentUserEmail = email || null;
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('app-root').style.display = '';
  try { if (await migrateReceiptsToIndexedDB()) saveData(); } catch (e) { console.error('receipt migration failed', e); }
  switchTab('home');
  notifyDueRecurringToday();
  renderAll();
  if (!DATA.settings.rateUpdatedAt || Date.now() - new Date(DATA.settings.rateUpdatedAt).getTime() > 6 * 60 * 60 * 1000) {
    fetchExchangeRate(true);
  }
  backfillReceiptsToCloud().then(changed => { if (changed) saveData(); }).catch(e => console.error('receipt cloud backfill failed', e));
}

initAuthFlow();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
